specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Jentic
providerId: jentic
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-15'
reconciled: false
notes: >-
  Jentic publishes a two-edition pricing page (jentic.com/pricing): Core
  Edition (free) and Enterprise Edition (contact sales). Specific quotas,
  rate limits, agent counts, seat counts, and overage rates are not
  publicly disclosed for either edition. Free tier defaults for API
  request quota and rate limit below are scaffold values inferred from
  the public docs' references to anonymous-vs-emailed rate-limit tiers
  on /auth/register, not published numbers. Enterprise terms are entirely
  custom-negotiated. Reconcile against a live quote / Jentic order form
  before treating these numbers as authoritative.
tags:
  - AI Agents
  - Arazzo
  - OpenAPI
  - MCP
  - Workflows
  - Integrations
description: >-
  Machine-readable plans and pricing for the Jentic agentic knowledge
  layer. Two public editions: Core (free, single-user, public APIs only)
  and Enterprise (gated, includes sandbox, private API ingestion,
  governance, VPC deployment, SLAs, dedicated support).
plans:
  - id: jentic-core
    name: Core Edition
    type: freemium
    publicUrl: https://jentic.com/pricing
    description: >-
      Free Core Edition for individual developers. Single-user access,
      Jentic-managed execution for the public APIs catalog (1,500+
      APIs), API AI-readiness diagnostics, and platform-managed
      execution for public API integrations.
    entries:
      - label: Seats
        description: Single-user access only.
        name: seats
        type: quota
        metric: users
        limit: 1
        timeFrame: account
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Public APIs Catalog
        description: Access to all 1,500+ public APIs in the Jentic catalog.
        name: catalog_access
        type: quota
        metric: apis
        limit: -1
        timeFrame: account
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Arazzo Workflows
        description: Access to the public 2,000+ Arazzo workflow library.
        name: workflows
        type: quota
        metric: workflows
        limit: -1
        timeFrame: account
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: API Requests
        description: >-
          Monthly request quota across /agents/search, /agents/load,
          /agents/execute. Scaffold value — not published by Jentic.
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Scaffold per-minute rate limit; not published by Jentic.
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Public Documentation
      - name: API AI Readiness Diagnostics
      - name: Platform Managed Execution
      - name: Public APIs Catalog (1,500+)
      - name: Arazzo Workflow Library (2,000+)
      - name: Remote MCP Server
      - name: Community Support
      - name: Standard Agent (Open Source)
      - name: Arazzo Runner (Open Source)
      - name: Jentic Mini (Self Hosted)
  - id: jentic-enterprise
    name: Enterprise Edition
    type: enterprise
    publicUrl: https://jentic.com/pricing
    pricingGated: true
    description: >-
      Contact-sales tier. Adds the Agentic Sandbox for safe behavior
      capture and validation, automated workflow discovery and
      generation, governance and integration controls, private API
      ingestion and management, organization-level accounts and access
      controls, SLAs, flexible hosting (customer-managed environments
      and VPC deployment), and premium support with a dedicated Slack
      channel and account manager. Specific quotas are negotiated.
    entries:
      - label: Seats
        description: Negotiated organization-level seat count.
        name: seats
        type: quota
        metric: users
        limit: -1
        timeFrame: contract
        unit: 1
        price: custom
        userMultiplied: true
      - label: API Requests
        description: Negotiated request volume; uncapped subject to fair use.
        name: api_requests
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: false
      - label: Rate Limit
        description: Negotiated burst and steady-state rate.
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 1000
        timeFrame: minute
        unit: 1
        price: custom
        userMultiplied: false
      - label: Private API Ingestion
        description: Ingest and operate private/internal APIs.
        name: private_apis
        type: quota
        metric: apis
        limit: -1
        timeFrame: contract
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Everything In Core Edition
      - name: Agentic Sandbox
      - name: Automated Workflow Discovery And Generation
      - name: Governance And Integration Controls
      - name: Private API Ingestion And Management
      - name: Organization Level Accounts And Access Controls
      - name: Service Level Agreements
      - name: Flexible Hosting (Customer Managed / VPC)
      - name: Premium Support
      - name: Dedicated Slack Channel
      - name: Dedicated Account Manager
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
