tools:
- name: list_credentials
  description: "Use this tool to list all API credentials the authenticated agent has access to.\nUse\
    \ this if a user asks \"What APIs can I use?\", \"What credentials do I have access to?\", \"What\
    \ apps are available to me?\", \"What APIs are available to me?\"\nThis is useful for debugging or\
    \ to understand what API credentials are available to the agent.\n\nDEPRECATION NOTICE: This tool\
    \ is being deprecated on 20 September 2026.\nExecution is moving to self-hosted Jentic One. It still\
    \ works for now but\nwill stop working on that date. See https://jentic.com/jentic-one, or\nfetch\
    \ the 'skill://onboard-jentic-one' MCP resource for a step-by-step\ninstall and onboarding guide.\n\
    \nReturns:\n    dict: Response with success status and list of credentials\n        {\n          \
    \  \"result\": {\n                \"success\": True,\n                \"credentials\": [c.model_dump(exclude_none=False)\
    \ for c in credentials],\n            }\n        }\n        On error:\n        {\n            \"result\"\
    : {\n                \"success\": False,\n                \"message\": \"Failed to load credentials\"\
    ,\n            }\n        }"
- name: search_apis
  description: 'Use this tool to explore for available actions or information based on what the user wants
    to do (e.g., ''find Discord servers'', ''send a message'').

    Use this to discover what APIs and operations exist in the Jentic catalogue.


    Execution is moving to self-hosted Jentic One: to run a discovered

    operation, install Jentic One (https://jentic.com/jentic-one) and use

    its search -> inspect -> execute flow through the local broker.'
- name: load_execution_info
  description: "Use this tool to get the full execution contract for a specific operation\n(its inputs,\
    \ outputs, and authentication requirements).\nThis tool must use the operation UUIDs returned from\
    \ the search_apis tool.\n\nDEPRECATION NOTICE: This tool is being deprecated on 20 September 2026.\n\
    Execution is moving to self-hosted Jentic One. It still works for now but\nwill stop working on that\
    \ date. To load an operation's contract and run\nit, install Jentic One (https://jentic.com/jentic-one)\
    \ and use its\n`jentic inspect` / `jentic execute` flow. For a step-by-step install and\nonboarding\
    \ guide, fetch the 'skill://onboard-jentic-one' MCP resource.\n\nExample operation UUIDs (returned\
    \ from search_apis tool):\n    NewsAPI.org GET /everything: op_ba86fdce1bade1b7\n    NewsAPI.org GET\
    \ /top-headlines: op_8ae297966b7f6da3\n    Finnhub.io GET /quote: op_f97a5db5e23f7b5a\n    Coincap.io\
    \ GET /v3/assets/\"slug\": op_e4a7f50d57fee805"
- name: execute
  description: "Use this tool to execute the chosen action for the user using the provided details.\n\
    Always include `inputs` even if there are none.\nTo reduce context, use `include_paths` to return\
    \ only the fields you need from the output.\n\nDEPRECATION NOTICE: This tool is being deprecated on\
    \ 20 September 2026.\nExecution is moving to self-hosted Jentic One. It still works for now but\n\
    will stop working on that date. To keep running operations, install\nJentic One (https://jentic.com/jentic-one)\
    \ and execute through its local\nbroker. For a step-by-step install and onboarding guide, fetch the\n\
    'skill://onboard-jentic-one' MCP resource.\n\nExample operation UUIDs (from search_apis / load_execution_info):\n\
    \    NewsAPI.org GET /everything: op_ba86fdce1bade1b7\n    NewsAPI.org GET /top-headlines: op_8ae297966b7f6da3\n\
    \    Finnhub.io GET /quote: op_f97a5db5e23f7b5a\n    Coincap.io GET /v3/assets/\"slug\": op_e4a7f50d57fee805"
