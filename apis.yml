- aid: jentic:jentic-configuration-api
  name: Jentic Configuration API
  description: >-
    Runtime, DB-backed platform configuration. Lets an operator set, read, and list configuration that
    previously required hand-editing backend YAML and restarting the server — starting with credential
    provider configs (e.g. Pipedream). A successful write rebuilds the in-process provider registry so
    the change takes effect without a restart. Secret fields (e.g. `client_secret`) are encrypted at rest
    and redacted on read. **Topology note:** in the combined (single-process) deployment a write takes
    effect immediately for all surfaces. In a multi-process deployment the control/broker processes pick
    up the new config at their next boot, not the instant the admin write lands; cross-process propagation
    is a tracked follow-up.
