  description: >-
    The public API **catalog** — a registry-side browse/preview/import surface over the Jentic public-APIs
    GitHub manifest. Powers the Discover experience: list importable APIs (`GET /catalog`, keyset cursor-paginated),
    preview an entry's operations (`GET /catalog/{api_id}/operations`), refresh the cached manifest (`POST
    /catalog:refresh`, `org:admin`), and import an entry into the local registry (`POST /catalog/{api_id}:import`).


