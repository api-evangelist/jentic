- aid: jentic:jentic-notes-api
  name: Jentic Notes API
  description: >-
    Free-form annotations attached to registry resources — an `Api`, an `ApiRevision`, a registered `operation_id`,
    an `ExecutionRecord`, or a `Credential`. Used to capture human or agent observations about quirks:
    *"this endpoint silently truncates email addresses to 64 chars"*, *"this credential rejects calls
    outside US business hours"*, *"this operation needs `Accept: application/json` even though the spec
    doesn't say so"*.


    Notes are an information surface for agents — they accumulate over time as the platform learns from
    real executions and surface back through `_links.notes` on the resources they annotate (woven in by
    individual surfaces as they need it).


    **Edit model.** Notes are editable via `PATCH`; each successful edit bumps a monotonic `revision`
    counter on the `Note`. Use the `If-Match` header on `PATCH` and `DELETE` to guard against concurrent
    modification.


    **Confidence promotion.** Notes carry both a `confidence` value (`observed | suspected | verified`)
    and a `confidence_source` (`client | platform_promoted`). Today only `client` is written by callers;
    the `platform_promoted` value is reserved for a future surface that auto-promotes `observed` notes
    to `verified` once enough matching `execution_feedback` accumulates.


    **Authentication.** Any authenticated principal (agent or human) can post any note type. Per-type
    policy (e.g. only humans may file `correction`) is enforced platform-side and not modelled in the
    spec.
  humanURL: https://docs.jentic.com/guides/mcp/remote-mcp/
  baseURL: https://api.jentic.com/mcp
