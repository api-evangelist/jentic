apis:
- aid: jentic:jentic-mcp
  name: Jentic Remote MCP Server
  humanURL: https://docs.jentic.com/guides/mcp/remote-mcp/
  baseURL: https://api.jentic.com/mcp
  description: >-
    The Jentic Remote MCP Server is the hosted Model Context Protocol endpoint that exposes the Jentic
    catalog to MCP-capable clients (Claude Desktop, ChatGPT, Cursor, Windsurf, VS Code). It speaks the
    same search / load / execute pattern as the Jentic API, but packaged as MCP tools. Supports OAuth
    2.0 with PKCE and dynamic client registration, with an API key fallback for Cursor and Windsurf.
  tags:
  - MCP
  - AI Agents
  - OAuth
  - Remote MCP
  properties:
  - url: https://docs.jentic.com/guides/mcp/
    type: Documentation
  - url: https://docs.jentic.com/guides/mcp/remote-mcp/
    type: GettingStarted
  - url: https://api.jentic.com/mcp
    type: BaseURL
  properties_authentication:
  - name: OAuth 2.0
    scheme: oauth2
    notes: >-
      Recommended. PKCE supported. Automatic token refresh. Dynamic client registration. Used by Claude
      Desktop, ChatGPT, Cursor, Windsurf.
  - name: API Key
    scheme: apiKey
    notes: >-
      Fallback for Cursor and Windsurf. Uses an agent-scoped Jentic API key (JENTIC_AGENT_API_KEY).
  properties_features:
  - name: search_apis Tool
    description: Lists matching APIs and workflows for a natural language query.
  - name: load_execution_info Tool
    description: Returns the schema and auth requirements for a chosen operation.
  - name: execute Tool
    description: Executes an operation or workflow with managed credentials.
  - name: list_credentials Resource
    description: Lists the agent's available upstream credentials.
- aid: jentic:arazzo-engine
  name: Arazzo Engine
  humanURL: https://github.com/jentic/arazzo-engine
  description: >-
    Open-source Python engine that executes Arazzo workflow specifications alongside OpenAPI operation
    definitions. Powers the Jentic platform's workflow execution and is also installable standalone as
    arazzo-runner for direct use in agents and automation. Handles authentication resolution (API key,
    OAuth 2.0, basic, bearer), dynamic server URL resolution, parameter chaining between steps, and blob
    storage for large binary payloads.
  tags:
  - Arazzo
  - OpenAPI
  - Workflows
  - Open Source
  properties:
  - url: https://github.com/jentic/arazzo-engine
    type: SourceCode
  - url: https://docs.jentic.com/getting-started/arazzo-runner/
    type: Documentation
  - url: https://pypi.org/project/arazzo-runner/
    type: PythonPackage
- aid: jentic:standard-agent
  name: Jentic Standard Agent
  humanURL: https://github.com/jentic/standard-agent
  description: >-
    Open-source composable reasoning agent framework that plans, acts, and recovers from failures, preconfigured
    with Jentic tools and a ReWOO reasoning loop. Primary entry point is the ReWOOAgent Python class.
    Bring-your-own LLM (Anthropic, OpenAI, Google). Demonstrates how to build an agent that uses Jentic's
    just-in-time tooling without committing to a specific agent framework.
  tags:
  - Agent Framework
  - ReWOO
  - Open Source
  - Python
  properties:
  - url: https://github.com/jentic/standard-agent
    type: SourceCode
  - url: https://docs.jentic.com/getting-started/standard-agent/
    type: Documentation
- aid: jentic:jentic-mini
  name: Jentic Mini
  humanURL: https://github.com/jentic/jentic-mini
  description: >-
    Free, open-source, self-hosted API execution layer that sits between an agent and the outside world.
    The agent says what it wants to do and Jentic Mini handles the how: finding the right API, injecting
    credentials at runtime, and brokering the request. Intended for teams that want Jentic's execution
    model without sending traffic through the hosted Jentic API.
  tags:
  - Self Hosted
  - Open Source
  - Agent Runtime
  properties:
  - url: https://github.com/jentic/jentic-mini
    type: SourceCode
- aid: jentic:jairf
  name: Jentic API AI-Readiness Framework (JAIRF)
  humanURL: https://github.com/jentic/api-ai-readiness-framework
  description: >-
    Technical specification for evaluating how interpretable, operable, and trustworthy an API is for
    AI systems and autonomous agents. Defines the signals, dimensions, scoring model, and normalization
    rules used by the Jentic API Scorecard product. Apache 2.0.
  tags:
  - Specification
  - API AI Readiness
  - Open Source
  properties:
  - url: https://github.com/jentic/api-ai-readiness-framework
    type: SourceCode
