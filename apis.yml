- aid: jentic:jentic-overlays-api
  name: Jentic Overlays API
  description: >-
    OpenAPI Overlay 1.0 (`https://spec.openapis.org/overlay/v1.0.0`) documents that correct an imported
    spec without rewriting it. Overlays capture wrong required fields, missing security schemes, undocumented
    headers, silent payload truncation, and other places where the upstream spec disagrees with the upstream
    API's actual behaviour — without forking the spec or waiting for an upstream fix.


    Overlays attach to the `Api` aggregate (not to a specific `ApiRevision`) and continue to apply across
    revision bumps until materially superseded. The optional `target_revision_id` records the revision
    the overlay was authored against, for auditing.


    **Lifecycle.** New overlays start in `pending`. The Broker calls `POST /apis/{vendor}/{name}/{version}/overlays/{overlay_id}:confirm`
    after the first successful upstream execution that exercised an overlay-patched operation, transitioning
    the overlay to `confirmed`. This is the platform's only documented data-plane → control-plane writeback.
    Once `confirmed`, an overlay stays `confirmed` — repeated `:confirm` calls return `200` with the existing
    record unchanged.


    **Edit model.** Overlay documents are editable via `PATCH` only while `pending`. Once `confirmed`
    (or `deprecated`), the document is immutable — to change a confirmed overlay, submit a new one and
    let the old one age out via `DELETE` (which soft-deprecates).


    **Deletion.** `DELETE` is a **soft-deprecation** — the row is preserved with `status: deprecated`
    for audit. Deprecated overlays no longer apply to spec-download merges (`?overlays=false` becomes
    the default for that overlay) but stay queryable via `GET`. There is no hard-delete in this surface.


    **Authentication.** Any authenticated principal (agent or human) can submit, edit, confirm, or deprecate
    overlays. Platform-side rate limits gate abuse.
