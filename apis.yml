- aid: jentic:jentic-permissions-api
  name: Jentic Permissions API
  description: >-
    Part of the **Admin / Audit** bounded context — the catalogue of grantable permission strings. Permissions
    are namespaced `resource:action` strings (`users:write`, `capabilities:execute`, `credentials:read`,
    …) gating every other surface in the API. The set is platform-defined and small; `GET /permissions`
    returns it in full, with each entry describing what it does, what it implies (the static implication
    map; e.g. `capabilities:execute` implies `apis:read` and `executions:read`), and whether the calling
    user is authorised to grant it.


    One reserved superpower short-circuits individual checks in code: `org:admin` (full deployment-wide
    access, granted via direct DB action). It is not enumerated to non-holders by `GET /permissions`,
    and is rejected by `PUT /users/{user_id}/permissions` from any caller who doesn't already hold it.


    The same vocabulary is used for `User.permissions` — coarse JWT-embedded scopes — so the catalogue
    below covers user assignment. Toolkits have no separate scope tier of their own: a toolkit API key
    is minted with the fixed broker-execute scope, and the per-binding fine-grained `PermissionRule[]`
    (the inner PBAC tier) lives separately under the `Toolkit Permissions` tag.
