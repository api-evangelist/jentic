specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Jentic
providerId: jentic
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-15'
reconciled: false
notes: >-
  Jentic does not publish a numeric rate-limit table on docs.jentic.com.
  The only published signal is that calling /auth/register with an
  optional email grants "higher rate limits" than anonymous registration,
  and that responses include a 429 status when limits are exceeded. The
  values below are scaffold defaults consistent with that signal and
  with industry norms for similar agent control planes — they are not
  official Jentic numbers. Reconcile from a live Jentic agent dashboard
  or order form before treating as authoritative.
tags:
  - AI Agents
  - Arazzo
  - OpenAPI
  - MCP
  - Workflows
  - Rate Limiting
  - Quotas
  - Throttling
description: >-
  Machine-readable rate limit definitions for the Jentic API surface.
  Captures per-tier quotas, burst behavior, response signaling, and
  recovery semantics.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  retryAfter: Retry-After
  policy: RateLimit-Policy
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - tier: anonymous
    name: Anonymous Register Default
    scope: api-key
    metric: requests_per_minute
    limit: 5
    burst: 10
    timeFrame: minute
    applies:
      - Jentic API
    notes: >-
      Default tier for keys minted via /auth/register without supplying
      an email. Scaffold value.
  - tier: free
    name: Core Edition Default
    scope: api-key
    metric: requests_per_minute
    limit: 30
    burst: 60
    timeFrame: minute
    applies:
      - Jentic API
      - Jentic Remote MCP
    notes: >-
      Default tier when /auth/register is called with an email, or when
      an agent is created in the Core Edition console. Scaffold value.
  - tier: free
    name: Core Edition Monthly Quota
    scope: api-key
    metric: requests_per_month
    limit: 10000
    timeFrame: month
    applies:
      - Jentic API
    notes: Scaffold value; Jentic does not publish a hard monthly quota.
  - tier: enterprise
    name: Enterprise Negotiated Limit
    scope: contract
    metric: requests_per_minute
    limit: 1000
    burst: 5000
    timeFrame: minute
    applies:
      - Jentic API
      - Jentic Remote MCP
    notes: Negotiated; subject to fair use.
endpoints:
  - path: /auth/register
    notes: >-
      Anonymous endpoint, no API key required. Most aggressively rate
      limited to prevent key-minting abuse. Documented 429 response.
  - path: /agents/search
    notes: Standard agent-scoped rate limit applies.
  - path: /agents/load
    notes: Standard agent-scoped rate limit applies.
  - path: /agents/execute
    notes: >-
      Standard agent-scoped rate limit applies, but the upstream API
      called inside an Arazzo workflow has its own independent rate
      limit (Gmail, Slack, Linear, etc.) which can surface as a 502.
policies:
  - name: Backoff Strategy
    description: >-
      Clients should implement exponential backoff with jitter and honor
      the Retry-After header when present.
  - name: Burst Handling
    description: >-
      Short bursts above the steady-state limit are tolerated up to the
      documented burst ceiling before throttling engages.
  - name: Quota Reset
    description: >-
      Monthly quotas reset at the start of each calendar month in UTC.
      Per-minute windows are sliding.
  - name: Fair Use
    description: >-
      Even on uncapped enterprise tiers, sustained usage that materially
      impacts shared infrastructure may be throttled.
  - name: Upstream Limits Pass Through
    description: >-
      Jentic does not absorb upstream API quotas. If an executed
      operation triggers Gmail / Linear / Slack rate limits, the
      upstream 429 surfaces as a 502 from /agents/execute.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
