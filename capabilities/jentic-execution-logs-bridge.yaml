naftiko: "1.0.0-alpha2"

info:
  title: Jentic Execution Logs Bridge
  description: >-
    Pulls Jentic execution history (per execution_id, with agent_uuid,
    api_name, execution_type, status) and bridges into Naftiko's
    OpenTelemetry pipeline so a single observability dashboard correlates
    Jentic-executed operations and Arazzo workflows with Naftiko-shipped
    capability calls.
  tags:
    - Naftiko
    - Jentic
    - Partnership
    - Observability
    - Execution-Logs
    - OpenTelemetry
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: jentic-env
    description: Jentic agent-scoped API key.
    keys:
      JENTIC_API_KEY: JENTIC_API_KEY

capability:
  consumes:
    - namespace: jentic
      type: http
      baseUri: https://api.jentic.com
      authentication:
        type: bearer
        token: '{{JENTIC_API_KEY}}'
      resources:
        - name: list-executions
          path: '/executions'
          operations:
            - name: list-executions
              method: GET
              inputParameters:
                - { name: since, in: query, type: string, required: false }
                - { name: agent_uuid, in: query, type: string, required: false }
                - { name: api_name, in: query, type: string, required: false }
                - { name: execution_type, in: query, type: string, required: false }
                - { name: status, in: query, type: string, required: false }
                - { name: cursor, in: query, type: string, required: false }
        - name: execution
          path: '/executions/{{execution_id}}'
          operations:
            - name: get-execution
              method: GET
              inputParameters:
                - { name: execution_id, in: path, required: true }
        - name: execution-summary
          path: '/executions/summary'
          operations:
            - name: get-execution-summary
              method: GET
              inputParameters:
                - { name: since, in: query, type: string, required: false }
                - { name: groupby, in: query, type: string, required: false }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: jentic-execution-logs-bridge-rest
      description: REST surface for Jentic execution logs.
      resources:
        - name: executions
          path: '/executions'
          operations:
            - name: list-executions
              method: GET
              inputParameters:
                - { name: since, in: query, type: string, required: false }
                - { name: agent_uuid, in: query, type: string, required: false }
                - { name: api_name, in: query, type: string, required: false }
                - { name: execution_type, in: query, type: string, required: false }
                - { name: status, in: query, type: string, required: false }
                - { name: cursor, in: query, type: string, required: false }
              call: jentic.list-executions
        - name: execution
          path: '/executions/{execution_id}'
          operations:
            - name: get-execution
              method: GET
              inputParameters:
                - { name: execution_id, in: path, type: string, required: true }
              call: jentic.get-execution
        - name: execution-summary
          path: '/executions/summary'
          operations:
            - name: get-execution-summary
              method: GET
              inputParameters:
                - { name: since, in: query, type: string, required: false }
                - { name: groupby, in: query, type: string, required: false }
              call: jentic.get-execution-summary

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: jentic-execution-logs-bridge-mcp
      description: MCP server for SRE / observability agents to query Jentic execution history.
      tools:
        - name: list-executions
          description: List Jentic execution log entries with optional filters (since, agent, api, type, status).
          hints: { readOnly: true }
          inputParameters:
            - { name: since, type: string, required: false, description: ISO 8601 timestamp lower bound. }
            - { name: agent_uuid, type: string, required: false, description: Filter to a specific agent. }
            - { name: api_name, type: string, required: false, description: Filter to a specific API. }
            - { name: execution_type, type: string, required: false, description: Filter by type (operation / workflow). }
            - { name: status, type: string, required: false, description: Filter by status. }
            - { name: cursor, type: string, required: false, description: Pagination cursor. }
          call: jentic.list-executions
        - name: get-execution
          description: Get a single Jentic execution by execution_id (status, agent, api, output, errors).
          hints: { readOnly: true }
          inputParameters:
            - { name: execution_id, type: string, required: true, description: Jentic execution UUID. }
          call: jentic.get-execution
        - name: get-execution-summary
          description: Aggregate Jentic execution summary (counts by status / api / type / agent).
          hints: { readOnly: true }
          inputParameters:
            - { name: since, type: string, required: false, description: ISO 8601 timestamp lower bound. }
            - { name: groupby, type: string, required: false, description: Group dimension (api / agent / type). }
          call: jentic.get-execution-summary
