naftiko: 1.0.0-alpha2
info:
  label: Jentic API
  description: >-
    Base capability that consumes the Jentic hosted API and re-exposes it
    over REST and MCP. Provides the canonical search → load → execute
    surface for any agent (Standard Agent, ReWOO, Cursor, Claude Desktop,
    ChatGPT, custom Python/TypeScript) to reach the Jentic catalog of
    1,500+ APIs and 2,000+ Arazzo workflows behind a single
    agent-scoped API key.
  tags:
    - Jentic
    - AI Agents
    - Arazzo
    - MCP
    - OpenAPI
  created: '2026-05-15'
  modified: '2026-05-15'
capability:
  consumes:
    - type: http
      namespace: jentic
      baseUri: https://api.jentic.com/api/v1
      description: Jentic hosted agent control plane.
      authentication:
        type: apikey
        in: header
        name: X-JENTIC-API-KEY
        value: '{{JENTIC_AGENT_API_KEY}}'
      resources:
        - name: auth-register
          path: /auth/register
          operations:
            - name: registerAccount
              method: POST
              description: Register a new Jentic account and mint an API key.
              outputRawFormat: json
              outputParameters:
                - name: api_key
                  type: string
                  value: $.api_key
                - name: uuid
                  type: string
                  value: $.uuid
        - name: agents-search
          path: /agents/search
          operations:
            - name: searchApis
              method: POST
              description: Semantic search over the Jentic catalog.
              outputRawFormat: json
              outputParameters:
                - name: results
                  type: array
                  value: $.results
        - name: agents-load
          path: /agents/load
          operations:
            - name: loadExecutionInfo
              method: POST
              description: Load full execution spec for one or more UUIDs.
              outputRawFormat: json
              outputParameters:
                - name: tool_info
                  type: object
                  value: $.tool_info
        - name: agents-execute
          path: /agents/execute
          operations:
            - name: executeOperation
              method: POST
              description: Execute an operation or Arazzo workflow.
              outputRawFormat: json
              outputParameters:
                - name: output
                  type: object
                  value: $.output
                - name: status
                  type: string
                  value: $.status
                - name: execution_id
                  type: string
                  value: $.execution_id
  exposes:
    - type: rest
      port: 8080
      namespace: jentic-rest
      description: REST adapter over the Jentic API.
      resources:
        - path: /auth/register
          name: registerAccount
          operations:
            - method: POST
              name: registerAccount
              call: jentic.registerAccount
        - path: /agents/search
          name: searchApis
          operations:
            - method: POST
              name: searchApis
              call: jentic.searchApis
        - path: /agents/load
          name: loadExecutionInfo
          operations:
            - method: POST
              name: loadExecutionInfo
              call: jentic.loadExecutionInfo
        - path: /agents/execute
          name: executeOperation
          operations:
            - method: POST
              name: executeOperation
              call: jentic.executeOperation
    - type: mcp
      port: 9090
      namespace: jentic-mcp
      transport: http
      description: MCP adapter exposing Jentic tools to MCP-capable clients.
      tools:
        - name: search_apis
          description: Search the Jentic catalog by natural language.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: jentic.searchApis
        - name: load_execution_info
          description: Load schema and auth requirements for one or more UUIDs.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: jentic.loadExecutionInfo
        - name: execute
          description: Execute an operation or Arazzo workflow.
          hints:
            readOnly: false
            destructive: true
            idempotent: false
          call: jentic.executeOperation
binds:
  - namespace: env
    keys:
      JENTIC_AGENT_API_KEY: JENTIC_AGENT_API_KEY
