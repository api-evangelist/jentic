naftiko: 1.0.0-alpha2
info:
  label: Jentic API — Authentication
  description: 'Jentic API — Authentication. 1 operations. Lead operation: Register A New Jentic Account. Self-contained Naftiko
    capability covering one Jentic business surface.'
  tags:
  - Jentic
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JENTIC_API_KEY: JENTIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: jentic-authentication
    baseUri: https://api.jentic.com/api/v1
    description: Jentic API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: auth-register
      path: /auth/register
      operations:
      - name: registeraccount
        method: POST
        description: Register A New Jentic Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-JENTIC-API-KEY
      value: '{{env.JENTIC_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: jentic-authentication-rest
    port: 8080
    description: REST adapter for Jentic API — Authentication. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/auth/register
      name: auth-register
      description: REST surface for auth-register.
      operations:
      - method: POST
        name: registeraccount
        description: Register A New Jentic Account
        call: jentic-authentication.registeraccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: jentic-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Jentic API — Authentication. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: register-new-jentic-account
      description: Register A New Jentic Account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: jentic-authentication.registeraccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
