naftiko: 1.0.0-alpha2
info:
  label: Jentic API — Search
  description: 'Jentic API — Search. 1 operations. Lead operation: Search For APIs And Workflows. Self-contained Naftiko capability
    covering one Jentic business surface.'
  tags:
  - Jentic
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JENTIC_API_KEY: JENTIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: jentic-search
    baseUri: https://api.jentic.com/api/v1
    description: Jentic API — Search business capability. Self-contained, no shared references.
    resources:
    - name: agents-search
      path: /agents/search
      operations:
      - name: searchapis
        method: POST
        description: Search For APIs And Workflows
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-JENTIC-API-KEY
      value: '{{env.JENTIC_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: jentic-search-rest
    port: 8080
    description: REST adapter for Jentic API — Search. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/agents/search
      name: agents-search
      description: REST surface for agents-search.
      operations:
      - method: POST
        name: searchapis
        description: Search For APIs And Workflows
        call: jentic-search.searchapis
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: jentic-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Jentic API — Search. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: search-apis-and-workflows
      description: Search For APIs And Workflows
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: jentic-search.searchapis
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
