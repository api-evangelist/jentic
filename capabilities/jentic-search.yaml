naftiko: "1.0.0-alpha2"

info:
  title: Jentic Search
  description: >-
    Calls Jentic's semantic search API over its catalog of 1,500+ public
    APIs and 2,000+ Arazzo workflows. Lets a Naftiko capability discover
    Jentic-cataloged operations (op_*) and workflows (wf_*) by intent
    and surface them into Backstage Fleet discovery alongside Naftiko-
    declared capabilities.
  tags:
    - Naftiko
    - Jentic
    - Partnership
    - Discovery
    - Search
    - Arazzo
    - Catalog
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: jentic-env
    description: Jentic agent-scoped API key (X-JENTIC-API-KEY header).
    keys:
      JENTIC_API_KEY: JENTIC_API_KEY

capability:
  consumes:
    - namespace: jentic
      type: http
      baseUri: https://api.jentic.com
      authentication:
        type: bearer
        token: '{{JENTIC_API_KEY}}'
      resources:
        - name: search
          path: '/agents/search'
          operations:
            - name: search-catalog
              method: POST

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: jentic-search-rest
      description: REST surface for Jentic catalog semantic search.
      resources:
        - name: search
          path: '/search'
          operations:
            - name: search-catalog
              method: POST
              call: jentic.search-catalog

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: jentic-search-mcp
      description: MCP server exposing Jentic semantic search to AI agents.
      tools:
        - name: search-catalog
          description: Semantic search over Jentic's 1,500+ APIs and 2,000+ Arazzo workflows. Returns ranked op_/wf_ UUIDs with scores.
          hints: { readOnly: true }
          call: jentic.search-catalog
