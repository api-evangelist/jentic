naftiko: "1.0.0-alpha2"

info:
  title: Jentic Credentials Vault
  description: >-
    Manages Jentic's server-side credential vault (the layer that injects
    credentials into Jentic operations + workflows so agents never see
    raw tokens) from Naftiko spec. Lets a Naftiko capability declare
    third-party SaaS dependencies and have Jentic broker the credentials
    behind the scenes — the Naftiko engine never holds long-lived
    third-party tokens.
  tags:
    - Naftiko
    - Jentic
    - Partnership
    - Credentials
    - Vault
    - OAuth
    - Identity
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: jentic-env
    description: Jentic agent-scoped API key.
    keys:
      JENTIC_API_KEY: JENTIC_API_KEY

capability:
  consumes:
    - namespace: jentic
      type: http
      baseUri: https://api.jentic.com
      authentication:
        type: bearer
        token: '{{JENTIC_API_KEY}}'
      resources:
        - name: list-credentials
          path: '/credentials'
          operations:
            - name: list-credentials
              method: GET
              inputParameters:
                - { name: api_name, in: query, type: string, required: false }
            - name: register-credential
              method: POST
        - name: credential
          path: '/credentials/{{credential_id}}'
          operations:
            - name: get-credential
              method: GET
              inputParameters:
                - { name: credential_id, in: path, required: true }
            - name: update-credential
              method: PUT
              inputParameters:
                - { name: credential_id, in: path, required: true }
            - name: delete-credential
              method: DELETE
              inputParameters:
                - { name: credential_id, in: path, required: true }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: jentic-credentials-vault-rest
      description: REST surface for managing the Jentic credential vault from Naftiko spec.
      resources:
        - name: credentials
          path: '/credentials'
          operations:
            - name: list-credentials
              method: GET
              inputParameters:
                - { name: api_name, in: query, type: string, required: false }
              call: jentic.list-credentials
            - name: register-credential
              method: POST
              call: jentic.register-credential
        - name: credential
          path: '/credentials/{credential_id}'
          operations:
            - name: get-credential
              method: GET
              inputParameters:
                - { name: credential_id, in: path, type: string, required: true }
              call: jentic.get-credential
            - name: update-credential
              method: PUT
              inputParameters:
                - { name: credential_id, in: path, type: string, required: true }
              call: jentic.update-credential
            - name: delete-credential
              method: DELETE
              inputParameters:
                - { name: credential_id, in: path, type: string, required: true }
              call: jentic.delete-credential

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: jentic-credentials-vault-mcp
      description: MCP server for managing the Jentic credential vault from Naftiko-built agents.
      tools:
        - name: list-credentials
          description: List credentials registered with the Jentic vault (optionally filtered by API name).
          hints: { readOnly: true }
          inputParameters:
            - { name: api_name, type: string, required: false, description: Filter to a specific API. }
          call: jentic.list-credentials
        - name: register-credential
          description: Register a new credential with the Jentic vault.
          hints: { destructiveHint: false }
          call: jentic.register-credential
        - name: get-credential
          description: Get a single Jentic credential entry by ID (metadata only — secret never returned).
          hints: { readOnly: true }
          inputParameters:
            - { name: credential_id, type: string, required: true, description: Jentic credential ID. }
          call: jentic.get-credential
        - name: update-credential
          description: Update a Jentic credential.
          hints: { destructiveHint: true }
          inputParameters:
            - { name: credential_id, type: string, required: true, description: Jentic credential ID. }
          call: jentic.update-credential
        - name: delete-credential
          description: Delete a Jentic credential.
          hints: { destructiveHint: true }
          inputParameters:
            - { name: credential_id, type: string, required: true, description: Jentic credential ID. }
          call: jentic.delete-credential
