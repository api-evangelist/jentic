naftiko: 1.0.0-alpha2
info:
  label: Run Jentic workflows from n8n nodes
  description: Trigger a Jentic API workflow from an n8n workflow node; n8n hands off Arazzo execution to Jentic and consumes the result downstream.
  tags:
  - Jentic
  - Integration
  - Workflow automation
  - n8n
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    JENTIC_API_KEY: JENTIC_API_KEY
    N8N_API_KEY: N8N_API_KEY
capability:
  consumes:
  - type: http
    namespace: jentic
    baseUri: https://api.jentic.com
    description: Jentic API operations consumed by this integration.
    resources:
    - name: agents-search
      path: /agents/search
      operations:
      - name: searchapis
        method: POST
        description: Search Jentic for the workflow referenced by the n8n node parameters.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: agents-execute
      path: /agents/execute
      operations:
      - name: executeoperation
        method: POST
        description: Execute the Jentic workflow on behalf of the n8n node.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  - type: http
    namespace: n8n
    baseUri: https://yourdomain.app.n8n.cloud
    description: n8n Webhook API operations consumed by this integration.
    resources:
    - name: webhook-path
      path: /webhook/{path}
      operations:
      - name: invokeworkflow
        method: POST
        description: 'n8n Webhook API: invokeWorkflow'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: path
          in: path
          type: string
          description: Path parameter path.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: mcp
    namespace: jentic-n8n-mcp
    description: MCP adapter for the jentic-n8n integration.
    tools:
    - name: jentic_n8n
      description: Execute the jentic n8n integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: jentic-n8n-rest
    port: 8080
    description: REST adapter for the jentic-n8n integration.
    resources:
    - path: /jentic-n8n
      name: jentic-n8n
      description: REST surface for the jentic-n8n integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the jentic-n8n integration.
        call: jentic_n8n
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
