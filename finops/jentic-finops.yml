      - Arazzo
      - OpenAPI
      - Workflows
  - name: Jentic Remote MCP
    baseURL: https://api.jentic.com/mcp
    serviceName: Jentic Remote MCP
    serviceCategory: MCP Server
    tags:
      - MCP
      - AI Agents
unitEconomics:
