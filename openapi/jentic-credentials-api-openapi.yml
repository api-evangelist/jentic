      - state
      title: ConnectChallengeResponse
      type: object
    CredentialRedactedResponse:
      description: Redacted credential response (for read/list/patch).
      examples:
      - active: true
        api:
          name: stripe
          vendor: stripe.com
          version: '2024-04-10'
        created_at: '2026-01-15T09:30:00Z'
        credential_id: cred_01HZX9...
        details:
          field_name: Authorization
          hint: …live_abcd
          location: header
        name: Stripe live key
        provider: static
        type: api_key
      properties:
        active:
          description: Whether the credential is enabled for injection.
          title: Active
          type: boolean
        api:
          $ref: '#/components/schemas/APIReference'
          description: The (vendor, name, version) API this credential targets.
        catalog_api_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Catalog identity slug of the target API (`domain[/sub-api]`), when recorded at create time. Display-only; null for older credentials.
          title: Catalog Api Id
        created_at:
          description: Creation timestamp (UTC).
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          description: Identity that created the credential (its owner).
          title: Created By
        credential_id:
          description: Stable credential identifier, prefixed `cred_`.
          title: Credential Id
          type: string
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 'Redacted, type-specific projection (hints/last-N chars; never the secret). For oauth2: client_id, token_url, grant_type (authorization_code | client_credentials), scopes, and — for authorization_code only — `connected`, whether the interactive sign-in completed and is still usable (null for other grants).'
          title: Details
        name:
          description: Human-readable label.
          title: Name
          type: string
        provider:
          description: Credential provider; 'static' for stored secrets.
          title: Provider
          type: string
        provider_account_ref:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque reference to the provider account, when applicable.
          title: Provider Account Ref
        server_variables:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          description: OpenAPI server-variable values for URL template substitution.
          title: Server Variables
        type:
          $ref: '#/components/schemas/CredentialType'
          description: Credential auth type (api_key, bearer_token, basic, oauth2).
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Last update timestamp (UTC).
          title: Updated At
      required:
      - credential_id
      - type
      - name
      - api
      - provider
      - active
      - created_at
      title: CredentialRedactedResponse
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    APIReferenceRequest:
      description: Relaxed variant for request bodies where partial identification is allowed.
      properties:
        catalog_api_id:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Catalog Api Id
        name:
          default: ''
          title: Name
          type: string
        vendor:
          title: Vendor
          type: string
        version:
          default: ''
          title: Version
          type: string
      required:
      - vendor
      title: APIReferenceRequest
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    BearerTokenCreateRequest:
