        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Secret
          x-sensitive: true
        grant_type:
          default: client_credentials
          title: Grant Type
          type: string
        name:
          title: Name
          type: string
        provider:
          default: static
          title: Provider
          type: string
        runtime_config:
          anyOf:
          - $ref: '#/components/schemas/RuntimeConfig'
          - type: 'null'
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
        server_variables:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Server Variables
        token_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Token Url
        type:
          const: oauth2
