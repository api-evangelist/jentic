              - $ref: '#/components/schemas/BasicAuthCreateRequest'
              - $ref: '#/components/schemas/OAuth2CreateRequest'
              - $ref: '#/components/schemas/NoAuthCreateRequest'
              - $ref: '#/components/schemas/Sigv4CreateRequest'
              title: Body
        required: true
