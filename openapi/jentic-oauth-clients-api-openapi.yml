          title: Allowed Scopes
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Name
        redirect_uris:
          anyOf:
          - items:
              maxLength: 2048
              type: string
            maxItems: 20
            minItems: 1
            type: array
          - type: 'null'
