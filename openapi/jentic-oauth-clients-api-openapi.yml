                status: 403
                title: Forbidden
                type: forbidden
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              example:
                detail: The requested resource does not exist or is not visible to you.
                instance: /example/path
                status: 404
                title: Not Found
                type: not_found
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not Found
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Deny OAuth client
      tags:
      - OAuth Clients
  /oauth-clients:
    post:
      description: 'Register a public OAuth client anonymously (RFC 7591 subset).


        Returns 201 with the new ``client_id``, or 200 with the **existing** row''s

        ``client_id`` on an exact dedupe match (D8, extended per G13/#1251):

        (``software_id`` + redirect-URI set), falling back to (``client_name`` +

        redirect-URI set) for registrations without a ``software_id`` — so a

        pending client''s awaiting-approval retry loop re-attaches instead of

        minting duplicate rows. Re-registering a client an administrator has

        deactivated re-enters the approval queue: the registration re-attaches

        (200) and the client awaits a fresh admin decision (#1312). No

        client_secret is ever issued here and no registration_access_token

        is returned (D12). New rows await admin approval unless the deployment

        auto-approves registrations (D9). The ``server.mcp.oauth.enabled`` gate

        lives on the route class — a disabled door 404s before this handler,

        its body validation, or the rate limiter ever run.'
      operationId: registerOauthClientEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegistrationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientRegistrationResponse'
          description: Successful Response
        '400':
          description: 'Invalid client metadata (RFC 7591 §3.2.2): `{"error": "invalid_client_metadata", "error_description": "..."}`.'
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security: []
      summary: Register OAuth client (anonymous DCR)
      tags:
      - OAuth Clients
