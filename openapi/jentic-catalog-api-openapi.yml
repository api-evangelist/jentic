tags:
- description: 'The public API **catalog** — a registry-side browse/preview/import surface over the Jentic public-APIs GitHub manifest. Powers the Discover experience: list importable APIs (`GET /catalog`, keyset cursor-paginated), preview an entry''s operations (`GET /catalog/{api_id}/operations`), refresh the cached manifest (`POST /catalog:refresh`, `org:admin`), and import an entry into the local registry (`POST /catalog/{api_id}:import`).


    The catalog is a cache of an upstream document, distinct from the local registry (`GET /apis`): `/apis` is what this deployment has imported, `/catalog` is what it *could* import. Each entry''s `registered` flag reflects whether its `spec_url` already backs a local API revision. Import resolves to a plain fetchable spec URL and reuses the standard async import job — no catalog identity ever crosses into the importer.'
  name: Catalog
paths:
  /catalog:
    get:
      description: 'List a keyset page of browsable catalog entries (search/filter aware).


        The catalog holds thousands of entries, so this is cursor-paginated like

        ``GET /apis``: follow ``next_cursor`` until ``has_more`` is false.

        ``catalog_total``/``registered_count``/``outdated_count`` count the whole

        manifest, not the page, so the Discover status row stays stable while scrolling.'
      operationId: listCatalog
      parameters:
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Q
      - in: query
        name: registered_only
        required: false
        schema:
          default: false
          title: Registered Only
          type: boolean
      - in: query
        name: unregistered_only
        required: false
        schema:
          default: false
          title: Unregistered Only
          type: boolean
      - in: query
        name: outdated_only
        required: false
        schema:
          default: false
          title: Outdated Only
          type: boolean
      - in: query
        name: include_snoozed
        required: false
        schema:
          default: false
          title: Include Snoozed
          type: boolean
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'
          description: Successful Response
        '400':
          content:
            application/problem+json:
              example:
                detail: The request was malformed or failed a precondition.
                instance: /example/path
                status: 400
                title: Bad Request
                type: bad_request
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              example:
                detail: Authentication is required or the bearer token is invalid.
                instance: /example/path
                status: 401
                title: Unauthorized
                type: unauthorized
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              example:
                detail: The authenticated principal lacks the required permission.
                instance: /example/path
                status: 403
                title: Forbidden
                type: forbidden
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Forbidden
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: List Catalog
      tags:
      - Catalog
