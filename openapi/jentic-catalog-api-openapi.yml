      title: PreviewInfoResponse
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    CatalogListResponse:
      description: List of catalog entries plus status fields for the Discover status row.
      examples:
      - catalog_total: 5231
        data: []
        has_more: true
        manifest_age_seconds: 3600
        next_cursor: eyJpZCI6ICJzdHJpcGUuY29tIn0=
        registered_count: 12
      properties:
        catalog_total:
          description: Total entries in the whole manifest (pre-filter, pre-page).
          title: Catalog Total
          type: integer
        data:
          description: The page of catalog entries.
          items:
            $ref: '#/components/schemas/CatalogEntryResponse'
          title: Data
          type: array
        has_more:
          default: false
          description: Whether another page follows.
          title: Has More
          type: boolean
        manifest_age_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          description: Age of the cached manifest in seconds, or null when the cache is empty.
          title: Manifest Age Seconds
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque keyset cursor for the next page (null when done).
          title: Next Cursor
        outdated_count:
          default: 0
          description: Count of whole-manifest registered entries with an upstream update available.
          title: Outdated Count
          type: integer
        registered_count:
          description: Count of whole-manifest entries already imported locally.
          title: Registered Count
          type: integer
      required:
      - data
      - catalog_total
      - registered_count
      title: CatalogListResponse
      type: object
    CatalogEntryResponse:
      description: A single browsable catalog entry.
      examples:
      - _links:
          import: /catalog/stripe.com:import
          operations: /catalog/stripe.com/operations
          self: /catalog/stripe.com
        api_id: stripe.com
        path: apis/openapi/stripe.com
        registered: false
        spec_url: https://raw.githubusercontent.com/jentic/jentic-public-apis/main/apis/openapi/stripe.com/main/2024-01-01/openapi.json
        vendor: stripe.com
      properties:
        _links:
          $ref: '#/components/schemas/CatalogEntryLinksResponse'
        api_id:
          description: Catalog identity of the API (manifest domain, e.g. `stripe.com`).
          title: Api Id
          type: string
        path:
          anyOf:
          - type: string
          - type: 'null'
          description: Manifest path of the entry within the public-APIs repo.
          title: Path
        registered:
          description: Whether this entry is already imported locally — its `spec_url` backs a non-archived revision in `GET /apis`.
          title: Registered
          type: boolean
        spec_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Fetchable OpenAPI spec URL the entry resolves to (used for import + coverage).
          title: Spec Url
        update_available:
          default: false
          description: Whether this (registered) entry has an upstream spec update the local revision hasn't adopted yet. Always false for unregistered entries.
          title: Update Available
          type: boolean
        vendor:
          anyOf:
          - type: string
          - type: 'null'
          description: Registrable-domain vendor derived from `api_id` (e.g. `stripe.com`).
          title: Vendor
      required:
      - api_id
      - vendor
      - path
      - spec_url
      - registered
      - _links
      title: CatalogEntryResponse
      type: object
    CatalogSnoozeRequest:
      description: 'Body for ``POST /catalog/{api_id}:snooze`` (C1, #925).


        ``snoozed_until`` is optional: omit or send ``null`` to mute-until-newer (the primary

        per-API affordance — the badge re-lights only when a *newer* upstream digest lands);

        provide an ISO-8601 timestamp for a time-boxed snooze that lapses at that instant.'
      properties:
        snoozed_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Optional expiry for the snooze (ISO-8601). Null = mute until a newer upstream digest is observed.
          title: Snoozed Until
      title: CatalogSnoozeRequest
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    PreviewParameterResponse:
      description: A slimmed parameter in an operation preview.
      examples:
      - description: Page size.
        in: query
        name: limit
        required: false
      properties:
        description:
          description: Parameter description (empty string when absent).
          title: Description
          type: string
        in:
          description: OpenAPI parameter location.
          title: In
          type: string
        name:
          description: Parameter name.
          title: Name
          type: string
        required:
          description: Whether the parameter is required.
          title: Required
          type: boolean
      required:
      - name
      - in
      - required
      - description
      title: PreviewParameterResponse
      type: object
    ApiImportResponse:
      description: Acknowledgement payload for an asynchronous import job.
      properties:
        _links:
          $ref: '#/components/schemas/ApiImportLinksResponse'
        job_id:
          title: Job Id
          type: string
        status:
          title: Status
          type: string
      required:
      - job_id
      - status
      - _links
      title: ApiImportResponse
      type: object
    CatalogRefreshResponse:
      description: Acknowledgement of a manifest refresh.
      examples:
      - count: 5231
        status: refreshed
      properties:
        count:
          description: Number of entries in the freshly fetched manifest.
          title: Count
          type: integer
        status:
          default: refreshed
          description: Refresh outcome marker.
          title: Status
          type: string
      required:
      - count
      title: CatalogRefreshResponse
      type: object
    PreviewOperationResponse:
      description: A slimmed operation in a catalog spec preview.
      examples:
      - description: ''
        method: GET
        operation_id: listCharges
        parameters: []
        path: /v1/charges
        security:
        - BearerAuth
        summary: List charges
        tags:
        - charges
      properties:
        description:
          description: Operation description (empty string when absent).
          title: Description
          type: string
        method:
          description: Upper-case HTTP method.
          title: Method
          type: string
        operation_id:
          anyOf:
          - type: string
          - type: 'null'
          description: OpenAPI operationId, when declared.
          title: Operation Id
        parameters:
          description: Merged path- and operation-level parameters.
          items:
            $ref: '#/components/schemas/PreviewParameterResponse'
          title: Parameters
          type: array
        path:
          description: Operation path template.
          title: Path
          type: string
        security:
          description: Flattened names of the security schemes that apply.
          items:
            type: string
          title: Security
          type: array
        summary:
          description: Operation summary (empty string when absent).
          title: Summary
          type: string
        tags:
          description: Operation tags.
          items:
            type: string
          title: Tags
          type: array
      required:
      - method
      - path
      - summary
      - description
      - operation_id
      - parameters
      - security
      - tags
      title: PreviewOperationResponse
      type: object
    ApiImportLinksResponse:
      description: Hypermedia links for an import response.
      properties:
        self:
          title: Self
          type: string
      required:
      - self
      title: ApiImportLinksResponse
      type: object
    CatalogEntryLinksResponse:
      description: Hypermedia links for a catalog entry.
      examples:
      - github: https://github.com/jentic/jentic-public-apis/tree/main/apis/openapi/stripe.com
        import: /catalog/stripe.com:import
        operations: /catalog/stripe.com/operations
        self: /catalog/stripe.com
      properties:
        github:
          anyOf:
          - type: string
          - type: 'null'
          description: Human-facing GitHub tree URL for the entry, when known.
          title: Github
        import:
          description: URL of the catalog import action (`POST /catalog/{api_id}:import`).
          title: Import
          type: string
        operations:
          description: URL of the entry's operation preview.
          title: Operations
          type: string
        self:
          description: Canonical URL of this catalog entry.
          title: Self
          type: string
      required:
      - self
      - operations
      - import
      title: CatalogEntryLinksResponse
      type: object
    OperationPreviewListResponse:
      description: 'Capped, offset-paginated operation preview for a catalog entry.


        Unlike list endpoints (cursor-paginated), the preview uses simple

        offset/limit pagination deliberately: it reads a single, already-fetched spec

        document and is hard-capped at ``PREVIEW_MAX_OPERATIONS`` operations, so there

        is no large/mutating result set that would justify keyset cursors.'
      examples:
      - data: []
        info:
          description: Payments.
          title: Stripe
          version: '2024-01-01'
        offset: 0
        security_schemes: {}
        total: 42
        truncated: true
      properties:
        data:
          description: The page of previewed operations.
          items:
            $ref: '#/components/schemas/PreviewOperationResponse'
          title: Data
          type: array
        info:
          $ref: '#/components/schemas/PreviewInfoResponse'
          description: The spec's `info` block.
        offset:
          description: Offset of the returned window.
          title: Offset
          type: integer
        security_schemes:
          additionalProperties:
            additionalProperties: true
            type: object
          description: Slimmed `components.securitySchemes` projection.
          title: Security Schemes
          type: object
        total:
          description: Total operations in the spec (pre-page).
          title: Total
          type: integer
        truncated:
          description: Whether more operations follow this window.
          title: Truncated
          type: boolean
      required:
      - data
      - total
      - offset
      - truncated
      - info
      - security_schemes
      title: OperationPreviewListResponse
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Opaque bearer access token (prefixed `at_`), sent as `Authorization: Bearer <token>`. It is **not** a JWT — it is a random string validated server-side by lookup, so it cannot be decoded by the client.


        Obtain one from `POST /oauth/token` using the grant for your actor type:

        - **Agents** — `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` with a JWT assertion signed by the key registered via `POST /register` (the JWT is the *assertion*, not the resulting access token).

        - **Service accounts** — `grant_type=client_credentials` with `client_id` + `client_secret`.

        - **Users** — `grant_type=authorization_code` (interactive) or `grant_type=password`; refresh either with `grant_type=refresh_token`.


        Service accounts can also mint short-lived, scope-narrowed task tokens for agents via `POST /oauth/mint`.


        Per-endpoint scope and actor-type requirements are not modelled in this document (OpenAPI cannot faithfully express the OR-of-scopes / `org:admin` bypass / service-layer enforcement); see `GET /reference/endpoints.json` for the authoritative authorization reference.'
      scheme: bearer
      type: http
