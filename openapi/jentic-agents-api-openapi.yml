components:
  schemas:
    OAuthGrantResponse:
      description: One consent→agent grant in API responses.
      properties:
        agent_id:
          description: The agent this grant binds the client to.
          title: Agent Id
          type: string
        can_revoke:
          description: Whether the CALLER may revoke this grant (the consenting user, or an admin holding the revoke permission set). May be false even for callers who can list — e.g. the agent's new owner after an ownership transfer, or a read-only admin.
          title: Can Revoke
          type: boolean
        client_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Display name of the registered client, if the row still exists.
          title: Client Name
        client_origin:
          anyOf:
          - type: string
          - type: 'null'
          description: Origin (scheme://host) of the client's first redirect URI — the 'authorized apps' display pattern.
          title: Client Origin
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          description: Grant ID (ksuid, `ocg_` prefix).
          title: Id
          type: string
        last_used_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Last time the client obtained tokens under this grant (stamped at exchange/refresh, not per request).
          title: Last Used At
        oauth_client_id:
          description: The client's public client_id — the same identifier stamped on tokens minted under this grant.
          title: Oauth Client Id
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        scopes:
          description: Scopes granted at consent (the D2 intersection).
          items:
            type: string
          title: Scopes
          type: array
        status:
          description: 'Grant lifecycle state: ``active`` or ``revoked``.'
          title: Status
          type: string
        user_id:
          description: 'The consenting user who approved this grant. Shown even after an agent ownership transfer: the grant stays with the original consenter (it is their consent, not the agent''s).'
          title: User Id
          type: string
      required:
      - id
      - oauth_client_id
      - client_name
      - client_origin
      - user_id
      - agent_id
      - scopes
      - status
      - created_at
      - revoked_at
      - last_used_at
      - can_revoke
      title: OAuthGrantResponse
      type: object
    AgentCreateRequest:
      description: Request body for creating an agent manually.
      properties:
        description:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        scopes:
          anyOf:
          - items:
              maxLength: 64
              minLength: 1
              pattern: ^[a-zA-Z0-9_:./-]+$
              type: string
            maxItems: 100
            type: array
          - type: 'null'
          title: Scopes
      required:
      - name
      title: AgentCreateRequest
      type: object
    ApiKeyHistoryResponse:
      description: Audit trail of API key operations.
      properties:
        data:
          items:
            $ref: '#/components/schemas/ApiKeyHistoryEntryResponse'
          title: Data
          type: array
      required:
      - data
      title: ApiKeyHistoryResponse
      type: object
    ToolkitBindingResponse:
      description: Toolkit binding representation in API responses.
      properties:
        agent_id:
          title: Agent Id
          type: string
        bound_at:
          format: date-time
          title: Bound At
          type: string
        id:
          title: Id
          type: string
        toolkit_id:
          title: Toolkit Id
          type: string
      required:
      - id
      - agent_id
      - toolkit_id
      - bound_at
      title: ToolkitBindingResponse
      type: object
    AgentScopesRequest:
      description: Request body for replacing an agent's scopes.
      properties:
        scopes:
          items:
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z0-9_:./-]+$
            type: string
          maxItems: 100
          title: Scopes
          type: array
      required:
      - scopes
      title: AgentScopesRequest
      type: object
    OAuthGrantListResponse:
      description: A paginated list of OAuth grants.
      properties:
        data:
          items:
            $ref: '#/components/schemas/OAuthGrantResponse'
          title: Data
          type: array
        has_more:
          title: Has More
          type: boolean
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - data
      - has_more
      title: OAuthGrantListResponse
      type: object
    AgentListResponse:
      description: List of agents.
      properties:
        data:
          items:
            $ref: '#/components/schemas/AgentResponse'
          title: Data
          type: array
        has_more:
          title: Has More
          type: boolean
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - data
      - has_more
      title: AgentListResponse
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    ToolkitBindingListResponse:
      description: List of toolkit bindings.
      properties:
        data:
          items:
            $ref: '#/components/schemas/ToolkitBindingResponse'
          title: Data
          type: array
      required:
      - data
      title: ToolkitBindingListResponse
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    jentic_one__auth__web__schemas__agents__DenyRequest:
      description: Request body for denying an agent.
      properties:
        reason:
          maxLength: 1024
          minLength: 1
          title: Reason
          type: string
      required:
      - reason
      title: DenyRequest
      type: object
    AgentResponse:
      description: Agent representation in API responses.
      properties:
        approved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Approved At
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
        created_at:
          format: date-time
          title: Created At
          type: string
        denial_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Denial Reason
        denied_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Denied By
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        has_api_key:
          default: false
          title: Has Api Key
          type: boolean
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        owner_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Id
        parent_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Agent Id
        registered_by:
          title: Registered By
          type: string
        status:
          title: Status
          type: string
      required:
      - id
      - name
      - registered_by
      - status
      - created_at
      title: AgentResponse
      type: object
    ApiKeyHistoryEntryResponse:
      description: A single event in the API key audit trail.
      properties:
        action:
          title: Action
          type: string
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        id:
          title: Id
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      required:
      - id
      - action
      - occurred_at
      title: ApiKeyHistoryEntryResponse
      type: object
    ToolkitBindRequest:
      description: Request body for binding a toolkit.
      properties:
        toolkit_id:
          maxLength: 255
          minLength: 1
          title: Toolkit Id
          type: string
      required:
      - toolkit_id
      title: ToolkitBindRequest
      type: object
    JwksUpdateRequest:
      description: 'Request body for updating an agent''s JWKS (public keys).


        The JWKS must contain at least one Ed25519 public key and must not

        contain any private key material.'
      properties:
        jwks:
          additionalProperties: true
          description: JWKS containing public keys
          title: Jwks
          type: object
      required:
      - jwks
      title: JwksUpdateRequest
      type: object
    ApiKeyResponse:
      description: Response containing a plaintext API key (shown once).
      properties:
        key:
          title: Key
          type: string
      required:
      - key
      title: ApiKeyResponse
      type: object
    ApiKeyInfoResponse:
      description: API key metadata — retrievable even after revocation.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        id:
          title: Id
          type: string
        rotated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Rotated At
        status:
          title: Status
          type: string
      required:
      - id
      - status
      - created_at
      title: ApiKeyInfoResponse
      type: object
    ClaimRequest:
      description: Request body for claiming ownership of a self-registered agent.
      properties:
        token:
          maxLength: 512
          minLength: 1
          title: Token
          type: string
          x-sensitive: true
      required:
      - token
      title: ClaimRequest
      type: object
    AgentPatchRequest:
      description: Request body for partially updating an agent.
      properties:
        description:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          title: Description
        name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        owner_id:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Owner Id
      title: AgentPatchRequest
      type: object
    AgentScopesResponse:
      description: Response containing an agent's current scopes.
      properties:
        scopes:
          items:
            type: string
          title: Scopes
          type: array
      required:
      - scopes
      title: AgentScopesResponse
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Opaque bearer access token (prefixed `at_`), sent as `Authorization: Bearer <token>`. It is **not** a JWT — it is a random string validated server-side by lookup, so it cannot be decoded by the client.


        Obtain one from `POST /oauth/token` using the grant for your actor type:

        - **Agents** — `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` with a JWT assertion signed by the key registered via `POST /register` (the JWT is the *assertion*, not the resulting access token).

        - **Service accounts** — `grant_type=client_credentials` with `client_id` + `client_secret`.

        - **Users** — `grant_type=authorization_code` (interactive) or `grant_type=password`; refresh either with `grant_type=refresh_token`.


        Service accounts can also mint short-lived, scope-narrowed task tokens for agents via `POST /oauth/mint`.


        Per-endpoint scope and actor-type requirements are not modelled in this document (OpenAPI cannot faithfully express the OR-of-scopes / `org:admin` bypass / service-layer enforcement); see `GET /reference/endpoints.json` for the authoritative authorization reference.'
      scheme: bearer
      type: http
