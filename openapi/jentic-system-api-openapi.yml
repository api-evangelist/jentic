  /system/version:
    get:
      description: 'Return the running version and the latest available release.


        Requires an authenticated session (any valid caller; no special

        permission). The SPA reads it from inside the signed-in shell to show the

        current version and, when a newer release is available, an update banner.

        The latest release is resolved best-effort (cached); on any failure it is

        ``null`` and no banner shows.'
      operationId: getVersion
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
          description: Successful Response
      security:
      - BearerAuth: []
      summary: Running and latest-available app version
      tags:
      - System
components:
  schemas:
    VersionResponse:
      description: The running app version and the latest release known to this backend.
      properties:
        current:
          description: The version of jentic-one currently running on this backend.
          title: Current
          type: string
        latest:
          anyOf:
          - type: string
          - type: 'null'
          description: The latest published release of jentic-one, without a leading 'v'. Null when the backend can't determine it (update check disabled, air-gapped, a remote backend, or GitHub was unreachable).
          title: Latest
        update_available:
          description: True when `latest` is a newer release than `current`. Matches the verdict `jenticctl update` would print.
          title: Update Available
          type: boolean
      required:
      - current
      - update_available
      title: VersionResponse
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    HealthResponse:
      description: Health check response for the admin surface.
      properties:
        next_step:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Step
        setup_required:
          title: Setup Required
          type: boolean
        status:
          title: Status
          type: string
        surface:
          title: Surface
          type: string
      required:
      - status
      - surface
      - setup_required
      title: HealthResponse
      type: object
    InstanceIdentityResponse:
      description: 'Self-describing identity of the backend serving this request.


        A client can compare ``backend``/``canonical_base_url``/``host`` against where

        it *thinks* it is pointed to confirm it is talking to the intended backend

        (e.g. a local install vs. a remote one) before diagnosing "missing" data.'
      properties:
        backend:
          description: 'Operator-declared backend locality (server.backend): ''local'' for a self-hosted install on the operator''s own machine/network, ''remote'' for a hosted install run elsewhere. A hint, not an authorization signal; defaults to ''local''.'
          enum:
          - local
          - remote
          title: Backend
          type: string
        canonical_base_url:
          description: The instance's own canonical base URL (auth.canonical_base_url), with any userinfo stripped; '' if unset.
          title: Canonical Base Url
          type: string
        host:
          description: Host (and port, when the canonical base URL declares one) parsed from canonical_base_url; '' if unset or unparseable.
          title: Host
          type: string
        instance_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque digest derived from the telemetry instance id — stable per install, but not the telemetry id itself. Null when telemetry has not resolved an id (e.g. telemetry disabled).
          title: Instance Id
        mcp_enabled:
          default: false
          description: 'Whether this instance serves the daemon-native Streamable HTTP MCP endpoint at /mcp (server.mcp.enabled). Lets clients (notably the UI''s agent MCP card) advertise the HTTP transport only when it exists. Not sensitive: the endpoint''s enabled state is observable by probing /mcp anyway.'
          title: Mcp Enabled
          type: boolean
      required:
      - backend
      - canonical_base_url
      - host
      title: InstanceIdentityResponse
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Opaque bearer access token (prefixed `at_`), sent as `Authorization: Bearer <token>`. It is **not** a JWT — it is a random string validated server-side by lookup, so it cannot be decoded by the client.


        Obtain one from `POST /oauth/token` using the grant for your actor type:

        - **Agents** — `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` with a JWT assertion signed by the key registered via `POST /register` (the JWT is the *assertion*, not the resulting access token).

        - **Service accounts** — `grant_type=client_credentials` with `client_id` + `client_secret`.

        - **Users** — `grant_type=authorization_code` (interactive) or `grant_type=password`; refresh either with `grant_type=refresh_token`.


        Service accounts can also mint short-lived, scope-narrowed task tokens for agents via `POST /oauth/mint`.


        Per-endpoint scope and actor-type requirements are not modelled in this document (OpenAPI cannot faithfully express the OR-of-scopes / `org:admin` bypass / service-layer enforcement); see `GET /reference/endpoints.json` for the authoritative authorization reference.'
      scheme: bearer
      type: http
