  /health:
    get:
      description: 'Liveness probe for the combined control-plane app.


        Unauthenticated and dependency-free so orchestrators and load balancers

        have a stable target. Returns ``{"status": "ok"}`` when the process is up.'
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security: []
      summary: Health
      tags:
      - System
  /instance:
    get:
      description: 'Return this backend''s self-describing identity.


        Unauthenticated and dependency-free so any client (an MCP server, the

        CLI, an agent) can read which backend it is bound to — local vs. a

        remote install — and label its responses accordingly.'
      operationId: getInstance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceIdentityResponse'
          description: Successful Response
      security: []
      summary: Backend identity
      tags:
      - System
