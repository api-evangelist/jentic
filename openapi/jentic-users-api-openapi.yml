components:
  schemas:
    RedeemInviteRequest:
      description: Payload for redeeming an invite token.
      properties:
        invite_token:
          maxLength: 512
          minLength: 1
          title: Invite Token
          type: string
          x-sensitive: true
        password:
          maxLength: 128
          minLength: 12
          title: Password
          type: string
          x-sensitive: true
      required:
      - invite_token
      - password
      title: RedeemInviteRequest
      type: object
    EffectivePermission:
      description: A single effective permission with provenance.
      properties:
        implied_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Implied By
        name:
          title: Name
          type: string
      required:
      - name
      title: EffectivePermission
      type: object
    Permissions:
      description: 'Structured permissions view: assigned + effective.'
      properties:
        assigned:
          items:
            type: string
          title: Assigned
          type: array
        effective:
          items:
            $ref: '#/components/schemas/EffectivePermission'
          title: Effective
          type: array
      required:
      - assigned
      - effective
      title: Permissions
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    UserCreatedResponse:
      description: Response after user creation including invite token.
      properties:
        invite_expires_at:
          format: date-time
          title: Invite Expires At
          type: string
        invite_token:
          title: Invite Token
          type: string
          x-sensitive: true
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
      - user
      - invite_token
      - invite_expires_at
      title: UserCreatedResponse
      type: object
    LoginRequest:
      description: Credentials for login.
      properties:
        email:
          maxLength: 320
          minLength: 1
          title: Email
          type: string
        password:
          maxLength: 128
          minLength: 1
          title: Password
          type: string
          x-sensitive: true
      required:
      - email
      - password
      title: LoginRequest
      type: object
    UserResponse:
      description: User representation in API responses.
      properties:
        active:
          title: Active
          type: boolean
        auth_provider:
          title: Auth Provider
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        external_subject_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Subject Id
        first_name:
          title: First Name
          type: string
        id:
          title: Id
          type: string
        invite_state:
          title: Invite State
          type: string
        last_name:
          title: Last Name
          type: string
        must_change_password:
          title: Must Change Password
          type: boolean
        name:
          title: Name
          type: string
        permissions:
          $ref: '#/components/schemas/Permissions'
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
      required:
      - id
      - email
      - first_name
      - last_name
      - name
      - active
      - auth_provider
      - invite_state
      - must_change_password
      - permissions
      - created_at
      title: UserResponse
      type: object
    ChangePasswordRequest:
      description: Payload for changing own password.
      properties:
        current_password:
          maxLength: 128
          minLength: 1
          title: Current Password
          type: string
          x-sensitive: true
        new_password:
          maxLength: 128
          minLength: 12
          title: New Password
          type: string
          x-sensitive: true
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    CreateAdminRequest:
      description: Payload for first-run admin creation (one-time setup).
      properties:
        email:
          maxLength: 320
          minLength: 1
          title: Email
          type: string
        first_name:
          default: Admin
          maxLength: 100
          minLength: 1
          title: First Name
          type: string
        last_name:
          default: User
          maxLength: 100
          minLength: 1
          title: Last Name
          type: string
        password:
          maxLength: 128
          minLength: 12
          title: Password
          type: string
          x-sensitive: true
      required:
      - email
      - password
      title: CreateAdminRequest
      type: object
    InviteIssuedResponse:
      description: Response when an invite token is issued.
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        token:
          title: Token
          type: string
          x-sensitive: true
      required:
      - token
      - expires_at
      title: InviteIssuedResponse
      type: object
    UserCreateRequest:
      description: Request body for creating a new user.
      properties:
        email:
          maxLength: 320
          minLength: 1
          title: Email
          type: string
        first_name:
          maxLength: 255
          minLength: 1
          title: First Name
          type: string
        last_name:
          maxLength: 255
          minLength: 1
          title: Last Name
          type: string
        permissions:
          default: []
          items:
            type: string
          title: Permissions
          type: array
      required:
      - email
      - first_name
      - last_name
      title: UserCreateRequest
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    InviteState:
      description: State of a user invitation.
      enum:
