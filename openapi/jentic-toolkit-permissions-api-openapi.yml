components:
  schemas:
    jentic_one__control__web__schemas__toolkits__PermissionRuleSchema:
      additionalProperties: false
      description: 'Permission rule for a toolkit-credential binding.


        Rules are evaluated first-match-wins. If no rule matches, the request is

        denied (default-deny). A binding with zero rules therefore blocks all

        operations — users must explicitly add at least one allow rule.'
      properties:
        effect:
          description: Whether this rule allows or denies the matched request.
          enum:
          - allow
          - deny
          title: Effect
          type: string
        match_mode:
          default: regex
          description: 'How `path` is interpreted: `regex` (full-match), `prefix` (string prefix), or `exact` (equality). Defaults to `regex` for backwards compatibility.'
          enum:
          - regex
          - prefix
          - exact
          title: Match Mode
          type: string
        methods:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: HTTP methods to match (case-insensitive). None matches all.
          title: Methods
        operations:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: OpenAPI operation IDs to match. None matches all operations.
          title: Operations
        path:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Path pattern to match. Interpreted per `match_mode`: `regex` uses full-match semantics (the pattern must describe the whole path); `prefix` and `exact` are literal. None matches all paths.'
          title: Path
      required:
      - effect
      title: PermissionRuleSchema
      type: object
    PermissionTestRequest:
      additionalProperties: false
      description: Request body for :test — dry-run a request shape against pooled rules.
      properties:
        method:
          description: HTTP method of the hypothetical request (case-insensitive).
          title: Method
          type: string
        operation_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional OpenAPI operation id resolved from the request URL.
          title: Operation Id
        path:
          description: Path of the hypothetical request as the broker would see it.
          title: Path
          type: string
      required:
      - method
      - path
      title: PermissionTestRequest
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    PermissionRuleReadSchema:
      description: Permission rule response (includes system fields).
      properties:
        _comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        _system:
          default: false
          title: System
          type: boolean
        effect:
          enum:
          - allow
          - deny
          title: Effect
          type: string
        match_mode:
          default: regex
          enum:
          - regex
          - prefix
          - exact
          title: Match Mode
          type: string
        methods:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Methods
        operations:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Operations
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
      required:
      - effect
      title: PermissionRuleReadSchema
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    PermissionTestResponse:
      description: Dry-run result matching :class:`PermissionTestResult`.
      properties:
        allowed:
          description: Whether the broker would allow this request under the pooled rules.
          title: Allowed
          type: boolean
        credential_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Which binding contributed the matching rule — vendor pooling means this may not equal the credential in the request URL.
          title: Credential Id
        effect:
          anyOf:
          - type: string
          - type: 'null'
          description: Effect of the matching rule (`allow`/`deny`); null when no match.
          title: Effect
        is_system:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True when the matching rule was written by the system; null when no match.
          title: Is System
        matched:
          description: Whether any rule matched; when false, the outcome is default-deny.
          title: Matched
          type: boolean
        rule_index:
          anyOf:
          - type: integer
          - type: 'null'
          description: Zero-based index in the vendor-pooled rule list; null when no match.
          title: Rule Index
      required:
      - allowed
      - matched
      title: PermissionTestResponse
      type: object
    PermissionRuleListResponse:
      description: List of permission rules.
      properties:
        data:
          items:
            $ref: '#/components/schemas/PermissionRuleReadSchema'
          title: Data
          type: array
      required:
      - data
      title: PermissionRuleListResponse
      type: object
    PermissionsPatchRequest:
      description: Patch permission rules — add and/or remove.
      properties:
        add:
          anyOf:
