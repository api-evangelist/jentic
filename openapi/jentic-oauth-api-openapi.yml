openapi: 3.2.0
info:
  contact:
    email: support@jentic.com
    name: Jentic Platform Team
    url: https://jentic.com/
  description: '## Overview ##

    The **Jentic Control Plane API** is the unified HTTP surface of the

    Jentic platform''s control plane — every administrative and

    metadata-facing endpoint outside the Broker data plane. The control plane is the administrative counterpart to the

    Broker data plane: where the Broker executes

    upstream API calls on behalf of agents, the control plane is where

    humans, operators, and agents configure *what* the Broker is

    allowed to do, *for whom*, *with which credentials*, *against

    which registered APIs*, and *with what telemetry retained*. ## Components ##

    High-level components for the control plane API. - **Core / Access** — credentials, toolkits,

    and PBAC grants and runtime params. Owns *who can call what, with which secret*. - **Registry** — registered APIs, immutable

    revisions, operations, search, lookup. Owns *what APIs are

    registered for this deployment and what they look like at any

    given revision*. - **Admin / Audit** — users, permissions,

    execution telemetry, async-job tracker, and dashboard event

    stream. Owns *who can sign in with what permissions* together

    with *what actually happened* — the human roster, the

    append-only records of brokered executions, the unified

    `Job` resource that both Registry imports and Broker

    async-execution calls feed into, and a curated `/events`

    surface for dashboards and operators. ## Authentication ##


    Today the platform ships a local username + password identity

    provider for human users, alongside agent identity (Dynamic Client

    Registration + RFC 7523 JWT-bearer assertions) and service-account

    client credentials — every authenticated operation expects

    `Authorization: Bearer ` (`BearerAuth`, an opaque `at_`

    token) except `GET /health`, `POST /auth/login`,

    `POST /users:create-admin`, and `POST /users:redeem-invite`. Human tokens are issued by `POST /auth/login` with a fixed 1-hour

    TTL and can be re-minted before expiry via `POST /auth/refresh`

    (sliding session, bounded by an absolute window —

    `admin.auth.session_ttl_seconds`, 12 hours by default); agents and

    service accounts obtain tokens from `POST /oauth/token` (see

    `BearerAuth`). The `permissions` claim on a token is a snapshot at

    issue time; permission changes take effect at the next re-issue —

    the next refresh or re-login (≤ 1 hour with the default TTL). The platform ships **no default credentials**. On a fresh

    install the users table is empty, so `GET /health` returns

    `setup_required: true` with `next_step: create_admin`. The

    operator creates the first administrator with `POST

    /users:create-admin {email, password}` — a one-time,

    unauthenticated, self-closing endpoint: it succeeds only while

    the users table is empty and returns `410 setup_already_complete`

    once any user exists (a single-row setup sentinel is the

    concurrency backstop, so two racing callers — even with different

    emails — cannot both bootstrap). It grants `org:admin`, sets the operator''s chosen

    password (so `must_change_password` is **false** — no forced

    rotation), and returns a ready-to-use `LoginResponse`

    (auto-login). After the first user exists `setup_required` flips

    to `false`. See the **Users** tag for the full onboarding

    walkthrough. External SSO providers (Okta, AWS Cognito, Auth0, Azure AD)

    plug in via the `User.auth_provider: external` hook plus an

    `external_subject_id` mapping; no concrete provider ships in

    this revision. Agent identity (separate from human users) uses

    Dynamic Client Registration (`POST /register`) with the agent''s

    JWKS, then RFC 7523 JWT-bearer assertions exchanged at

    `POST /oauth/token` for an opaque access token. ## Cross-cutting conventions


    - Every API reference uses the loose

    `APIReference(vendor, name, version)` data structure. There is no

    foreign key between Core, Registry, and Admin / Audit — the

    tuple is the only join. - **Error shape.** Every error response is RFC 9457 Problem

    Details (`application/problem+json`) using the shared

    `ProblemDetails` schema from

    jentic/api-problem-details.'
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  summary: HTTP surface of the Jentic platform's control plane — Core / Access (credentials, toolkits), Registry (registered APIs, operations, search), and Admin / Audit (execution telemetry, async jobs).
  title: Jentic Control Plane OAuth API
  version: 0.39.0
servers:
- description: Same-origin (relative)
  url: /
security:
- BearerAuth: []
tags:
- description: OAuth 2.0 / OIDC endpoints exposed by the platform authorization server — the authorize, token, introspection, revocation, and assertion-mint endpoints plus the redirect callback.
  name: OAuth
paths:
  /admin/oauth-grants:
    get:
      description: 'List consent→agent grants across all clients and agents.


        The admin cross-view over the grant registry: filter by client, agent,

        consenting user, or status. Each item carries the client''s display name

        and redirect-URI origin plus the consenting ``user_id`` — after an agent

        ownership transfer the grant stays with the original consenter, so this

        column is how an admin spots stranded grants.'
      operationId: listOauthGrants
      parameters:
      - description: Filter by the client's public client_id.
        in: query
        name: client_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by the client's public client_id.
          title: Client Id
      - description: Filter by bound agent.
        in: query
        name: agent_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by bound agent.
          title: Agent Id
      - description: Filter by consenting user.
        in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by consenting user.
          title: User Id
      - description: Filter by grant lifecycle state.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - revoked
            type: string
          - type: 'null'
          description: Filter by grant lifecycle state.
          title: Status
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthGrantAdminListResponse'
          description: Successful Response
        '400':
          content:
            application/problem+json:
              example:
                detail: The request was malformed or failed a precondition.
                instance: /example/path
                status: 400
                title: Bad Request
                type: bad_request
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              example:
                detail: Authentication is required or the bearer token is invalid.
                instance: /example/path
                status: 401
                title: Unauthorized
                type: unauthorized
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              example:
                detail: The authenticated principal lacks the required permission.
                instance: /example/path
                status: 403
                title: Forbidden
                type: forbidden
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Forbidden
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: List OAuth grants
      tags:
      - OAuth
  /authorize:
    get:
      description: 'RFC 6749 Authorization endpoint with PKCE (S256 only).


        If an external IdP is configured, redirects to the upstream provider.

        Otherwise returns an error (direct login requires a separate credential exchange).'
      operationId: authorizeEndpoint
      parameters:
      - in: query
        name: response_type
        required: true
        schema:
          title: Response Type
          type: string
      - in: query
        name: client_id
        required: true
        schema:
          title: Client Id
          type: string
      - in: query
        name: redirect_uri
        required: true
        schema:
          title: Redirect Uri
          type: string
      - in: query
        name: code_challenge
        required: true
        schema:
          title: Code Challenge
          type: string
      - in: query
        name: code_challenge_method
        required: true
        schema:
          title: Code Challenge Method
          type: string
      - in: query
        name: scope
        required: false
        schema:
          default: openid
          title: Scope
          type: string
      - in: query
        name: state
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - in: query
        name: nonce
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Nonce
      - description: Signed session-continuation blob minted by POST /oauth/session/continue (identity-ladder rung 1). Optional; an invalid or absent value leaves the flow byte-identical to before.
        in: query
        name: sc
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Signed session-continuation blob minted by POST /oauth/session/continue (identity-ladder rung 1). Optional; an invalid or absent value leaves the flow byte-identical to before.
          title: Sc
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '400':
          content:
            application/problem+json:
              example:
                detail: The request was malformed or failed a precondition.
                instance: /example/path
                status: 400
                title: Bad Request
                type: bad_request
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Bad Request
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security: []
      summary: Authorize Endpoint
      tags:
      - OAuth
  /error:
    get:
      description: Minimal error endpoint for browser-facing authorization failures.
      operationId: errorPage
      parameters:
      - in: query
        name: error
        required: false
        schema:
          default: unknown_error
          title: Error
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Errorpage
                type: object
          description: Successful Response
        '400':
          content:
            application/problem+json:
              example:
                detail: The request was malformed or failed a precondition.
                instance: /example/path
                status: 400
                title: Bad Request
                type: bad_request
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Bad Request
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security: []
      summary: Error Page
      tags:
      - OAuth
  /login:
    get:
      description: 'Render the local-account login form for an in-flight ``/authorize`` request.


        Verifies the ``ls`` signature/TTL/purpose **before** rendering — an

        expired, forged, or wrong-purpose token never gets a form — re-checks the

        D7 client gate (a client denied or deactivated while the user holds the

        ``ls`` must not be asked for a password), rejects an already-spent ``ls``,

        and embeds ``ls`` plus a fresh single-use CSRF nonce bound to it.'
      operationId: loginPage
      parameters:
      - description: Signed authorization-flow state (carry-through token)
        in: query
        name: ls
        required: true
        schema:
          description: Signed authorization-flow state (carry-through token)
          title: Ls
          type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
        '400':
          content:
            application/problem+json:
              example:
                detail: The request was malformed or failed a precondition.
                instance: /example/path
                status: 400
                title: Bad Request
                type: bad_request
            text/html:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Bad Request
        '404':
          description: 'Local-account login is unavailable (`auth.local_login.enabled=false`, or an external IdP is configured — `auth.idp.enabled=true` — which always wins): the route answers the framework''s plain route-not-found 404, so the gate state is unobservable.'
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
            text/html:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
            text/html:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
            text/html:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security: []
      summary: Local-account login form (authorization flow)
      tags:
      - OAuth
    post:
      description: 'Authenticate the local account and rejoin the authorization flow.


        Success never mints a JWT — it flows straight into code issuance (platform

        client) or the consent handle (registered third-party client), exactly

        where the IdP callback rejoins, and burns the single-use ``ls``.

        Credential failures re-render the form with one generic message: lockout

        state, unknown email, and wrong password are indistinguishable (no

        user-enumeration response oracle), while the shared

        ``AuthService.authenticate`` core still increments the failed-login count

        and applies the lockout threshold. An account flagged

        ``must_change_password`` authenticates but is told to rotate via the UI

        first — the OAuth plane must not hand a fully-scoped token to a

        temporary-password principal the UI would have boxed into

        change-password-only.'
      operationId: loginSubmit
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_loginSubmit'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '400':
          content:
            application/problem+json:
              example:
                detail: The request was malformed or failed a precondition.
                instance: /example/path
                status: 400
                title: Bad Request
                type: bad_request
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Bad Request
        '404':
          description: 'Local-account login is unavailable (`auth.local_login.enabled=false`, or an external IdP is configured — `auth.idp.enabled=true` — which always wins): the route answers the framework''s plain route-not-found 404, so the gate state is unobservable.'
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security: []
      summary: Local-account login submit (authorization flow)
      tags:
      - OAuth
  /oauth-grants/{grant_id}:revoke:
    post:
      description: 'Revoke a consent→agent grant — one of the three revocation kill radii.


        Allowed for the grant''s owner (the consenting user) or an admin. Marks

        the grant ``revoked`` and revokes every outstanding access/refresh token

        minted under it in the same transaction; the live resolvers also re-check

        grant status on every verdict (belt + braces). The client''s next token

        use or refresh fails closed. Idempotent on an already-revoked grant.'
      operationId: revokeOauthGrant
      parameters:
      - in: path
        name: grant_id
        required: true
        schema:
          title: Grant Id
          type: string
      responses:
        '204':
          description: Successful Response
        '400':
          content:
            application/problem+json:
              example:
                detail: The request was malformed or failed a precondition.
                instance: /example/path
                status: 400
                title: Bad Request
                type: bad_request
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              example:
                detail: Authentication is required or the bearer token is invalid.
                instance: /example/path
                status: 401
                title: Unauthorized
                type: unauthorized
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              example:
                detail: The authenticated principal lacks the required permission.
                instance: /example/path
                status: 403
                title: Forbidden
                type: forbidden
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              example:
                detail: The requested resource does not exist or is not visible to you.
                instance: /example/path
                status: 404
                title: Not Found
                type: not_found
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not Found
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Revoke OAuth grant
      tags:
      - OAuth
  /oauth/approval/decision:
    post:
      description: 'Thin wrapper over the admin approval path for the approval-pending page.


        Authorization is byte-identical to ``POST /admin/oauth-clients/{id}:approve``

        / ``:deny`` (``oauth-clients:write``, org:admin implies it) and the

        decision itself is the SAME ``OAuthClientService.approve``/``deny`` calls —

        same audit records, same D7 active/approval_status coupling; this endpoint

        only translates the signed state blob into the client row. CSRF posture

        matches the consent POST: no ambient credential is honored — the browser

        must explicitly present the SPA bearer token, which a cross-site form

        cannot do.'
      operationId: approvalDecisionEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthApprovalDecisionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthApprovalStatusResponse'
          description: Successful Response
        '400':
          description: Malformed, tampered, or expired approval-state blob.
        '401':
          content:
            application/problem+json:
              example:
                detail: Authentication is required or the bearer token is invalid.
                instance: /example/path
                status: 401
                title: Unauthorized
                type: unauthorized
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              example:
                detail: The authenticated principal lacks the required permission.
                instance: /example/path
                status: 403
                title: Forbidden
                type: forbidden
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Forbidden
        '422':
          content:
            application/problem+json:
              example:
                detail: Request validation failed; see errors[] for details.
                errors:
                - detail: Field 'name' must not be blank.
                  pointer: '#/name'
                instance: /example/path
                status: 422
                title: Unprocessable Entity
                type: validation_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              example:
                detail: An unexpected error occurred.
                instance: /example/path
                status: 500
                title: Internal Server Error
                type: server_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              example:
                detail: The database is temporarily unavailable; please retry.
                instance: /example/path
                status: 503
                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Approve or deny a pending client inline (approval-pending page)
      tags:
      - OAuth
  /oauth/approval/status:
    get:
      description: 'Minimal tri-state poll for the approval-pending page.


        Anonymous but keyed by the signed approval-state blob — never a bare

        client_id, so the endpoint cannot be used to enumerate registrations. Any

        verification failure (bad signature, wrong purpose, expired ``iat``,

        malformed blob) is a 400 ``invalid_grant``; the page reacts to a 400 by

        re-running /authorize, which mints a fresh blob. The response carries ONLY

        the tri-state — no names, redirect URIs, or metadata.'
      operationId: approvalStatusEndpoint
      parameters:
      - description: Signed approval-state blob minted by /authorize
        in: query
        name: st
        required: true
        schema:
          description: Signed approval-state blob minted by /authorize
          title: St
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthApprovalStatusResponse'
          description: Successful Response
        '400':
          description: Malformed, tampered, or expired approval-state blob.
