components:
  schemas:
    OAuthSessionContinueResponse:
      description: 'The resume leg for a successful session-continue exchange.


        ``redirect_url`` is a same-origin, relative ``/authorize`` URL re-running

        the ORIGINAL authorize request plus the short-TTL ``session``-purpose

        continuation blob (``sc``) pinning the platform user at exchange time.

        Relative by design (mirrors the approval-pending page''s resume URL): the

        page script navigates within its own origin, never to a caller-influenced

        absolute URL.'
      properties:
        redirect_url:
          title: Redirect Url
          type: string
      required:
      - redirect_url
      title: OAuthSessionContinueResponse
      type: object
    MintResponse:
      description: Ephemeral token minting response.
      properties:
        access_token:
          title: Access Token
          type: string
          x-sensitive: true
        expires_in:
          title: Expires In
          type: integer
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      - expires_in
      title: MintResponse
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    Body_consentSubmit:
      properties:
        action:
          title: Action
          type: string
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
        consent_token:
          title: Consent Token
          type: string
          x-sensitive: true
      required:
      - consent_token
      - action
      title: Body_consentSubmit
      type: object
    Body_loginSubmit:
      properties:
        csrf:
          title: Csrf
          type: string
          x-sensitive: true
        email:
          title: Email
          type: string
        ls:
          title: Ls
          type: string
        password:
          title: Password
          type: string
          x-sensitive: true
      required:
      - email
      - password
      - ls
      - csrf
      title: Body_loginSubmit
      type: object
    OAuthApprovalStatusResponse:
      description: 'Minimal tri-state approval status for a pending-client authorize request.


        Deliberately carries nothing else — no client name, redirect URIs, or

        metadata — so the anonymous poll endpoint cannot be used to read client

        details out of the registry.'
      properties:
        status:
          enum:
          - pending
          - approved
          - denied
          title: Status
          type: string
      required:
      - status
      title: OAuthApprovalStatusResponse
      type: object
    OAuthSessionContinueRequest:
      description: 'Front-channel session-continue exchange posted from the login page.


        ``state`` is the signed ``login``-purpose carry-through token (``ls``)

        minted by rung 3 of ``flow.resolve_identity_gate`` for this exact

        authorize request — the exchange never accepts bare flow parameters, so a

        caller cannot probe arbitrary client ids through it.


        ``state`` is deliberately NOT marked x-sensitive, for the same reason as

        ``OAuthApprovalDecisionRequest.state``: the CLI''s redaction backstop

        unions bare field names globally, and the blob is not a lasting bearer

        credential (HMAC-signed, purpose-discriminated, TTL''d; the endpoint

        additionally requires an authenticated platform user).'
      properties:
        state:
          title: State
          type: string
      required:
      - state
      title: OAuthSessionContinueRequest
      type: object
    RevokeRequest:
      description: 'Revocation endpoint request (RFC 7009) — JSON or form-encoded.


        ``token`` is required either way. ``token_type_hint``

        (``access_token``/``refresh_token``) is a lookup-order optimization only —

        the server falls through both types regardless (RFC 7009 §2.1).

        ``client_id`` belongs to the form-encoded public-client arm (G11): the

        secret-less client''s lineage binding; ignored on the bearer-authenticated

        JSON arm, where the platform identity scopes the revocation instead.'
      properties:
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        token:
          title: Token
          type: string
          x-sensitive: true
        token_type_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Token Type Hint
      required:
      - token
      title: RevokeRequest
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    TokenResponse:
      description: Token endpoint success response.
      properties:
        access_token:
          title: Access Token
          type: string
          x-sensitive: true
        expires_in:
          title: Expires In
          type: integer
        id_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Id Token
          x-sensitive: true
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
          x-sensitive: true
        scope:
          anyOf:
          - type: string
          - type: 'null'
          description: Space-delimited effective scopes of the minted access token (RFC 6749 §3.3), computed the way the platform's resolvers enforce them (live scope grants ∩ client ceiling ∩ consent-grant scopes for agent and service-account tokens), so the granted set may be narrower than requested and clients must not assume they got what they asked for. Present on every response whose token carries at least one scope; OMITTED (never the ABNF-invalid empty string) only when the effective set is empty — reachable solely on legs where the client requested no scopes at the token endpoint (the token request carries no scope parameter, and consent fails closed on an empty intersection).
          title: Scope
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      - expires_in
      title: TokenResponse
      type: object
    IntrospectRequest:
      description: Introspection endpoint request (form body).
      properties:
        token:
          title: Token
          type: string
          x-sensitive: true
        token_type_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Token Type Hint
      required:
      - token
      title: IntrospectRequest
      type: object
    OAuthGrantAdminResponse:
      description: One consent→agent grant in the admin cross-view.
      properties:
        agent_id:
          description: The agent this grant binds the client to.
          title: Agent Id
          type: string
        can_revoke:
          description: Whether the CALLER may revoke this grant (the consenting user, or an admin holding the revoke permission set). May be false even for callers who can list — e.g. a read-only admin.
          title: Can Revoke
          type: boolean
        client_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Display name of the registered client, if the row still exists.
          title: Client Name
        client_origin:
          anyOf:
          - type: string
          - type: 'null'
          description: Origin (scheme://host) of the client's first redirect URI — the 'authorized apps' display pattern.
          title: Client Origin
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          description: Grant ID (ksuid, `ocg_` prefix).
          title: Id
          type: string
        last_used_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Last time the client obtained tokens under this grant (stamped at exchange/refresh, not per request).
          title: Last Used At
        oauth_client_id:
          description: The client's public client_id — the same identifier stamped on tokens minted under this grant.
          title: Oauth Client Id
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        scopes:
          description: Scopes granted at consent (the D2 intersection).
          items:
            type: string
          title: Scopes
          type: array
        status:
          description: 'Grant lifecycle state: ``active`` or ``revoked``.'
          title: Status
          type: string
        user_id:
          description: 'The consenting user who approved this grant. Shown even after an agent ownership transfer: the grant stays with the original consenter (it is their consent, not the agent''s).'
          title: User Id
          type: string
      required:
      - id
      - oauth_client_id
      - client_name
      - client_origin
      - user_id
      - agent_id
      - scopes
      - status
      - created_at
      - revoked_at
      - last_used_at
      - can_revoke
      title: OAuthGrantAdminResponse
      type: object
    OAuthGrantAdminListResponse:
      description: A paginated list of OAuth grants (admin cross-view).
      properties:
        data:
          items:
            $ref: '#/components/schemas/OAuthGrantAdminResponse'
          title: Data
          type: array
        has_more:
          title: Has More
          type: boolean
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - data
      - has_more
      title: OAuthGrantAdminListResponse
      type: object
    OAuthApprovalDecisionRequest:
      description: 'Inline admin approve/deny posted from the approval-pending page.


        ``state`` is the signed approval-state blob minted by ``/authorize`` for

        this exact authorize request — the decision endpoint never accepts a bare

        ``client_id``.


        ``state`` is deliberately NOT marked x-sensitive: the CLI''s GEN-21

        redaction backstop unions every sensitive field''s BARE name globally, and

        "state" is generic enough to redact unrelated CLI output (e.g. the MCP

        session-diagnosis ``state`` field). The blob is not a lasting bearer

        credential — it is HMAC-signed, purpose-discriminated, TTL''d (600 s), and

        the decision endpoint additionally requires an authenticated admin with

        ``oauth-clients:write`` — so global redaction buys nothing worth that

        collision.'
      properties:
        action:
          enum:
          - approve
          - deny
          title: Action
          type: string
        state:
          title: State
          type: string
      required:
      - state
      - action
      title: OAuthApprovalDecisionRequest
      type: object
    IntrospectResponse:
      description: RFC 7662 introspection response.
      properties:
        active:
          title: Active
          type: boolean
        exp:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exp
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
        sub:
          anyOf:
          - type: string
          - type: 'null'
          title: Sub
        token_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Token Type
      required:
      - active
      title: IntrospectResponse
      type: object
    MintRequest:
      description: Ephemeral token minting request.
      properties:
        scope:
          title: Scope
          type: string
        target_agent_id:
          title: Target Agent Id
          type: string
        ttl_seconds:
          anyOf:
          - maximum: 3600.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Ttl Seconds
      required:
      - scope
      - target_agent_id
      title: MintRequest
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Opaque bearer access token (prefixed `at_`), sent as `Authorization: Bearer <token>`. It is **not** a JWT — it is a random string validated server-side by lookup, so it cannot be decoded by the client.


        Obtain one from `POST /oauth/token` using the grant for your actor type:

        - **Agents** — `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` with a JWT assertion signed by the key registered via `POST /register` (the JWT is the *assertion*, not the resulting access token).

        - **Service accounts** — `grant_type=client_credentials` with `client_id` + `client_secret`.

        - **Users** — `grant_type=authorization_code` (interactive) or `grant_type=password`; refresh either with `grant_type=refresh_token`.


        Service accounts can also mint short-lived, scope-narrowed task tokens for agents via `POST /oauth/mint`.


        Per-endpoint scope and actor-type requirements are not modelled in this document (OpenAPI cannot faithfully express the OR-of-scopes / `org:admin` bypass / service-layer enforcement); see `GET /reference/endpoints.json` for the authoritative authorization reference.'
      scheme: bearer
      type: http
