    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    jentic_one__control__web__schemas__access_requests__PermissionRuleSchema:
      additionalProperties: false
      description: Permission rule for an access request item.
      properties:
        effect:
          enum:
          - allow
          - deny
          - require-approval
          title: Effect
          type: string
        match_mode:
          default: regex
          description: 'How `path` is interpreted: `regex` (full-match), `prefix` (string prefix), or `exact` (equality). Defaults to `regex` for backwards compatibility.'
          enum:
          - regex
          - prefix
          - exact
          title: Match Mode
          type: string
        methods:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: HTTP methods to match (case-insensitive). None matches all.
          title: Methods
        operations:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: OpenAPI operation IDs to match. None matches all operations.
          title: Operations
        path:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Path pattern to match. Interpreted per `match_mode`: `regex` uses full-match semantics (the pattern must describe the whole path); `prefix` and `exact` are literal. None matches all paths.'
          title: Path
      required:
      - effect
      title: PermissionRuleSchema
      type: object
    AccessRequestOwnerResponse:
      description: 'Display info for the filer''s human owner (labelling only, not authorization).


        Server-resolved from ``filer_owner_id`` (falling back to ``created_by``

        when the former is null, mirroring what consumers render) so they don''t

        need ``users:read`` (or a roster fetch) just to label a row. Absent when

        the id doesn''t resolve to a user (service-account filers, purged rows) or

        on mutation responses, which skip the enrichment.'
      properties:
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          description: The owner's full name, when set on the profile.
          title: Display Name
        email:
          description: The owner's email address.
          title: Email
          type: string
        id:
          description: The resolved owner's user id (filer_owner_id, or created_by when null).
          title: Id
          type: string
      required:
      - id
      - email
      title: AccessRequestOwnerResponse
      type: object
    AccessRequestListResponse:
      description: Paginated list of access requests.
      properties:
        data:
