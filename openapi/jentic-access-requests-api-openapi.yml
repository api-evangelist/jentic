          minItems: 1
          title: Items
          type: array
      required:
      - items
      title: DecideRequest
      type: object
    AccessRequestItemRequest:
      description: 'A single line-item in a file request.


        **Permission rules:** Rules control which upstream API operations the broker

        allows through a credential binding. They are enforced per (toolkit_id,

        credential_id) pair, so they can only be attached to credential:bind items —

        not toolkit:bind or scope:grant. You do not need toolkits:write scope to set

        rules; include them directly on the credential:bind item when filing the

        access request, and the approver''s decision persists them on the binding.'
      properties:
        action:
          enum:
          - bind
          - grant
          - create
          - provision
          title: Action
          type: string
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_reference:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Resource Reference
        resource_type:
          enum:
          - credential
          - toolkit
          - scope
          title: Resource Type
          type: string
        rules:
          anyOf:
          - items:
              $ref: '#/components/schemas/jentic_one__control__web__schemas__access_requests__PermissionRuleSchema'
            type: array
          - type: 'null'
          description: 'Permission rules for the binding (credential:bind only). Rules are evaluated first-match-wins by the broker; if no rule matches, the request is denied. Example: [{"effect": "allow", "path": ".*"}].'
          title: Rules
        to_id:
          anyOf:
          - type: string
          - type: 'null'
          title: To Id
        to_type:
          anyOf:
          - type: string
          - type: 'null'
          title: To Type
      required:
      - resource_type
      - action
      title: AccessRequestItemRequest
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    EvaluationCheckResponse:
      description: A single evaluation check result.
      properties:
        blocker:
          anyOf:
          - type: string
          - type: 'null'
          title: Blocker
        check:
          title: Check
          type: string
        passed:
          title: Passed
          type: boolean
      required:
      - check
      - passed
      title: EvaluationCheckResponse
      type: object
    DuplicatePendingProblem:
      description: 'RFC 9457 Problem Details for a 409 on ``POST /access-requests``.


        Filing a request whose target already has a pending request is refused with

        a 409 whose body carries two extension members on top of the standard

        Problem Details shape, so a client can attach to the existing request rather

        than re-file. These are emitted at runtime by the access-request error hook

        (``control/web/errors.py``); this model documents them in the OpenAPI spec so

        the generated SDK exposes a typed 409

        (``FileAccessRequestHTTPResp.ApplicationproblemJSON409``) instead of forcing

        callers to parse the raw body (ARCH-21 Step 0).'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        approve_url:
          description: Console URL to review/approve the existing pending request.
          examples:
          - https://app.jentic.com/access-requests/acr_01HXXY...
          title: Approve Url
          type: string
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        existing_request_id:
          description: The id of the pending access request that already covers the conflicting target.
          examples:
          - acr_01HXXY...
          title: Existing Request Id
          type: string
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      - existing_request_id
      - approve_url
      title: DuplicatePendingProblem
      type: object
    EvaluationResponse:
      description: Computed evaluation of whether the caller can fulfill a request.
      properties:
        can_fulfill:
          title: Can Fulfill
          type: boolean
        checks:
          items:
            $ref: '#/components/schemas/EvaluationCheckResponse'
          title: Checks
          type: array
      required:
      - can_fulfill
      - checks
      title: EvaluationResponse
      type: object
    AmendRequest:
      description: Request body for the :amend verb.
      properties:
        items:
          items:
            $ref: '#/components/schemas/AmendItemSchema'
          minItems: 1
          title: Items
          type: array
      required:
      - items
      title: AmendRequest
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Opaque bearer access token (prefixed `at_`), sent as `Authorization: Bearer <token>`. It is **not** a JWT — it is a random string validated server-side by lookup, so it cannot be decoded by the client.


        Obtain one from `POST /oauth/token` using the grant for your actor type:

        - **Agents** — `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` with a JWT assertion signed by the key registered via `POST /register` (the JWT is the *assertion*, not the resulting access token).

        - **Service accounts** — `grant_type=client_credentials` with `client_id` + `client_secret`.

        - **Users** — `grant_type=authorization_code` (interactive) or `grant_type=password`; refresh either with `grant_type=refresh_token`.


        Service accounts can also mint short-lived, scope-narrowed task tokens for agents via `POST /oauth/mint`.


        Per-endpoint scope and actor-type requirements are not modelled in this document (OpenAPI cannot faithfully express the OR-of-scopes / `org:admin` bypass / service-layer enforcement); see `GET /reference/endpoints.json` for the authoritative authorization reference.'
      scheme: bearer
      type: http
