components:
  schemas:
    AccessRequestResponse:
      description: Response model for an access request envelope.
      properties:
        actor_id:
          title: Actor Id
          type: string
        approve_url:
          title: Approve Url
          type: string
        created_by:
          title: Created By
          type: string
        evaluation:
          anyOf:
          - $ref: '#/components/schemas/EvaluationResponse'
          - type: 'null'
        expires_at:
          format: date-time
          title: Expires At
          type: string
        filed_at:
          format: date-time
          title: Filed At
          type: string
        filer_owner:
          anyOf:
          - $ref: '#/components/schemas/AccessRequestOwnerResponse'
          - type: 'null'
        filer_owner_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Filer Owner Id
        id:
          title: Id
          type: string
        items:
          items:
            $ref: '#/components/schemas/AccessRequestItemResponse'
          title: Items
          type: array
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        requested_by:
          title: Requested By
          type: string
        status:
          title: Status
          type: string
      required:
      - id
      - actor_id
      - requested_by
      - status
      - approve_url
      - filed_at
      - expires_at
      - created_by
      - items
      title: AccessRequestResponse
      type: object
    DecideItemSchema:
      description: A single item decision.
      properties:
        decision:
          enum:
          - approved
          - denied
          title: Decision
          type: string
        decision_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Reason
        item_id:
          title: Item Id
          type: string
      required:
      - item_id
      - decision
      title: DecideItemSchema
      type: object
    AccessRequestItemResponse:
      description: Response model for a single access-request line item.
      properties:
        action:
          title: Action
          type: string
        already_satisfied:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether this item's outcome is already in effect (the binding or grant it asks for already exists), letting a reviewer approve manually-fulfilled work instead of re-doing it in the wizard. Populated on single-request GETs for pending credential:bind, toolkit:bind, and scope:grant items; null when not computed (list endpoints, decided items, fulfilment-only intents, an item whose target cannot be determined, an ambiguous toolkit reference — which approval would refuse as filed — or a credential:bind whose credential is not visible to the caller). Toolkit REFERENCES are resolved under the caller's visibility, mirroring decide-time resolution, so False can also mean 'satisfied by a toolkit this caller cannot see'; explicit-id targets are probed directly.
          title: Already Satisfied
        already_satisfied_by:
          anyOf:
          - type: string
          - type: 'null'
          description: For a satisfied toolkit:bind, the id of the toolkit the agent is already bound to — names the exact object so consumers can point the operator at it. Null for other item types and whenever already_satisfied is not true.
          title: Already Satisfied By
        applied_effects:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Applied Effects
        credential_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Name
