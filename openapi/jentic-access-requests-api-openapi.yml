        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decision_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Reason
        id:
          title: Id
          type: string
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        resource_reference:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Resource Reference
        resource_type:
          title: Resource Type
          type: string
        rules:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Rules
        status:
          title: Status
          type: string
        to_id:
          anyOf:
          - type: string
          - type: 'null'
          title: To Id
        to_type:
          anyOf:
          - type: string
          - type: 'null'
          title: To Type
        toolkit_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Toolkit Name
      required:
      - id
