components:
  schemas:
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    SecuritySchemeListResponse:
      description: List of security schemes for an API's current revision.
      properties:
        data:
          items:
            $ref: '#/components/schemas/SecuritySchemeResponse'
          title: Data
          type: array
      required:
      - data
      title: SecuritySchemeListResponse
      type: object
    ApiUpdateRequest:
      additionalProperties: false
      description: Partial update payload for an API's presentation fields.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        icon_url:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          title: Icon Url
      title: ApiUpdateRequest
      type: object
    SecuritySchemeFlowResponse:
      description: A single OAuth2 flow within a security scheme.
      properties:
        authorization_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization Url
        flow_type:
          title: Flow Type
          type: string
        refresh_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Url
        scopes:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Scopes
        token_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Token Url
      required:
      - flow_type
      title: SecuritySchemeFlowResponse
      type: object
    ApiListResponse:
      description: Cursor-paginated list of APIs.
      properties:
        data:
          items:
            $ref: '#/components/schemas/ApiResponse'
          title: Data
          type: array
        has_more:
          title: Has More
          type: boolean
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - data
      - has_more
      title: ApiListResponse
      type: object
    SecuritySchemeResponse:
      description: Full security scheme detail for a revision.
      properties:
        bearer_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Bearer Format
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        flows:
          items:
            $ref: '#/components/schemas/SecuritySchemeFlowResponse'
          title: Flows
          type: array
        in_location:
          anyOf:
          - type: string
          - type: 'null'
          title: In Location
        name:
          title: Name
          type: string
        open_id_connect_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Open Id Connect Url
        param_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Param Name
        scheme:
          anyOf:
          - type: string
          - type: 'null'
          title: Scheme
        type:
          title: Type
          type: string
      required:
      - name
      - type
      title: SecuritySchemeResponse
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    ApiLinksResponse:
      description: Hypermedia links for a (local) API resource.
      properties:
        current_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Revision
        revisions:
          title: Revisions
          type: string
        self:
          title: Self
          type: string
      required:
      - self
      - revisions
      title: ApiLinksResponse
      type: object
    ApiSourceInline:
      description: Import source carrying raw OpenAPI/Arazzo content inline.
      properties:
        api_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Name
        content:
          title: Content
          type: string
        filename:
          title: Filename
          type: string
        submitted_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Submitted By
        type:
          const: inline
          title: Type
          type: string
        vendor:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      required:
      - type
      - content
      - filename
      title: ApiSourceInline
      type: object
    ApiSourceUrl:
      description: Import source pointing at a fetchable URL.
      properties:
        api_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Name
        submitted_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Submitted By
        type:
          const: url
          title: Type
          type: string
        url:
          format: uri
          maxLength: 2083
          minLength: 1
          title: Url
          type: string
        vendor:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      required:
      - type
      - url
      title: ApiSourceUrl
      type: object
    ApiImportRequest:
      description: Wrapper for a batch of import sources.
      properties:
        sources:
          items:
            discriminator:
              mapping:
                inline: '#/components/schemas/ApiSourceInline'
                url: '#/components/schemas/ApiSourceUrl'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/ApiSourceUrl'
            - $ref: '#/components/schemas/ApiSourceInline'
          maxItems: 100
          minItems: 1
          title: Sources
          type: array
      required:
      - sources
      title: ApiImportRequest
      type: object
    ApiReferenceResponse:
      description: Core API identifier triple plus derived host.
      properties:
        host:
          anyOf:
          - type: string
          - type: 'null'
          title: Host
        name:
          title: Name
          type: string
        vendor:
          title: Vendor
          type: string
        version:
          title: Version
          type: string
      required:
      - vendor
      - name
      - version
      - host
      title: ApiReferenceResponse
      type: object
    ApiResponse:
      description: 'Full API aggregate response.


        ``GET /apis`` is the local registry — every item is an API imported into

        this deployment. The public catalog of importable-but-not-yet-imported APIs

        is a separate surface (``GET /catalog``); the two are not blended.'
      properties:
        _links:
          $ref: '#/components/schemas/ApiLinksResponse'
        api:
          $ref: '#/components/schemas/ApiReferenceResponse'
        catalog_api_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Catalog Api Id
        created_at:
          format: date-time
          title: Created At
          type: string
        current_revision_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Revision Id
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        icon_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon Url
        operation_count:
          title: Operation Count
          type: integer
        origin:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Provenance of the current revision: `catalog` (imported from the public catalog), `overlay` (materialized from a confirmed overlay), or null (manual import).'
          title: Origin
        revision_count:
          title: Revision Count
          type: integer
        security_schemes:
          items:
            type: string
          title: Security Schemes
          type: array
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Upstream spec URL backing the current revision, when known (catalog linkage).
          title: Source Url
        update_available:
          default: false
          description: Whether the upstream spec at `source_url` has a notified update this API hasn't adopted yet (Flow-3). Re-importing clears it.
          title: Update Available
          type: boolean
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - api
      - catalog_api_id
      - display_name
      - description
      - icon_url
      - current_revision_id
      - revision_count
      - operation_count
      - security_schemes
      - created_at
      - updated_at
      - _links
      title: ApiResponse
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Opaque bearer access token (prefixed `at_`), sent as `Authorization: Bearer <token>`. It is **not** a JWT — it is a random string validated server-side by lookup, so it cannot be decoded by the client.


        Obtain one from `POST /oauth/token` using the grant for your actor type:

        - **Agents** — `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` with a JWT assertion signed by the key registered via `POST /register` (the JWT is the *assertion*, not the resulting access token).

        - **Service accounts** — `grant_type=client_credentials` with `client_id` + `client_secret`.

        - **Users** — `grant_type=authorization_code` (interactive) or `grant_type=password`; refresh either with `grant_type=refresh_token`.


        Service accounts can also mint short-lived, scope-narrowed task tokens for agents via `POST /oauth/mint`.


        Per-endpoint scope and actor-type requirements are not modelled in this document (OpenAPI cannot faithfully express the OR-of-scopes / `org:admin` bypass / service-layer enforcement); see `GET /reference/endpoints.json` for the authoritative authorization reference.'
      scheme: bearer
      type: http
