                title: Service Unavailable
                type: database_unavailable
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: List toolkit credential bindings
      tags:
      - Toolkit Credentials
    post:
      description: Bind an existing credential to a toolkit, optionally with inline permission rules.
      operationId: bindCredential
      parameters:
      - in: path
        name: toolkit_id
        required: true
        schema:
          title: Toolkit Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolkitCredentialBindRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitCredentialBindingResponse'
