components:
  schemas:
    jentic_one__control__web__schemas__toolkits__PermissionRuleSchema:
      additionalProperties: false
      description: 'Permission rule for a toolkit-credential binding.


        Rules are evaluated first-match-wins. If no rule matches, the request is

        denied (default-deny). A binding with zero rules therefore blocks all

        operations — users must explicitly add at least one allow rule.'
      properties:
        effect:
          description: Whether this rule allows or denies the matched request.
          enum:
          - allow
          - deny
          title: Effect
          type: string
        match_mode:
          default: regex
          description: 'How `path` is interpreted: `regex` (full-match), `prefix` (string prefix), or `exact` (equality). Defaults to `regex` for backwards compatibility.'
          enum:
          - regex
          - prefix
          - exact
          title: Match Mode
          type: string
        methods:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: HTTP methods to match (case-insensitive). None matches all.
          title: Methods
        operations:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: OpenAPI operation IDs to match. None matches all operations.
          title: Operations
        path:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Path pattern to match. Interpreted per `match_mode`: `regex` uses full-match semantics (the pattern must describe the whole path); `prefix` and `exact` are literal. None matches all paths.'
          title: Path
      required:
      - effect
      title: PermissionRuleSchema
      type: object
    ToolkitCredentialBindRequest:
      additionalProperties: false
      description: Bind a credential to a toolkit.
      properties:
        allow_all:
          default: false
          description: 'Convenience flag: bind with a single `allow` rule that matches every request for this binding''s vendor. Mutually exclusive with `permissions`.'
          title: Allow All
          type: boolean
        credential_id:
          title: Credential Id
          type: string
        permissions:
          anyOf:
          - items:
              $ref: '#/components/schemas/jentic_one__control__web__schemas__toolkits__PermissionRuleSchema'
            type: array
          - type: 'null'
          title: Permissions
      required:
      - credential_id
      title: ToolkitCredentialBindRequest
      type: object
    ErrorItem:
      description: 'A granular error detail entry within the errors[] array of a ProblemDetails response.


        At least one of pointer, parameter, or header SHOULD be present to identify the error source.'
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code identifying this error in internal taxonomy or documentation.
          examples:
          - JENTIC-V-001
          title: Code
        detail:
          description: A human-readable explanation of this specific error. Be precise — name the field, parameter, or header involved.
          examples:
          - Field 'name' must not be blank.
          maxLength: 4096
          title: Detail
          type: string
        header:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the request header that is the source of this error.
          examples:
          - Authorization
          title: Header
        parameter:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: The name of the query or path parameter that is the source of this error.
          examples:
          - limit
          title: Parameter
        pointer:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A JSON Pointer (RFC 6901) to the specific request body property that is the source of this error.
          examples:
          - '#/name'
          title: Pointer
      required:
      - detail
      title: ErrorItem
      type: object
    PermissionRuleReadSchema:
      description: Permission rule response (includes system fields).
      properties:
        _comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        _system:
          default: false
          title: System
          type: boolean
        effect:
          enum:
          - allow
          - deny
          title: Effect
          type: string
        match_mode:
          default: regex
          enum:
          - regex
          - prefix
          - exact
          title: Match Mode
          type: string
        methods:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Methods
        operations:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Operations
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
      required:
      - effect
      title: PermissionRuleReadSchema
      type: object
    ToolkitCredentialBindingResponse:
      description: Credential binding response.
      properties:
        api_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Name
        api_vendor:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Vendor
        bound_at:
          format: date-time
          title: Bound At
          type: string
        catalog_api_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Catalog identity slug of the bound credential's target API (`domain[/sub-api]`), when recorded. Display-only.
          title: Catalog Api Id
        credential_id:
          title: Credential Id
          type: string
        credential_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Type
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        permissions:
          items:
            $ref: '#/components/schemas/PermissionRuleReadSchema'
          title: Permissions
          type: array
        toolkit_id:
          title: Toolkit Id
          type: string
        warnings:
          description: Non-fatal bind-time signals — e.g. a binding that landed with zero permission rules (broker denies by default until rules are added).
          items:
            $ref: '#/components/schemas/BindingWarningSchema'
          title: Warnings
          type: array
      required:
      - toolkit_id
      - credential_id
      - bound_at
      title: ToolkitCredentialBindingResponse
      type: object
    ProblemDetail:
      description: 'RFC 9457 Problem Details for HTTP APIs.


        This is the standard error response format for all Jentic APIs.

        Content-Type: application/problem+json


        See: https://www.rfc-editor.org/rfc/rfc9457.html'
      examples:
      - detail: The request body is missing one or more required fields.
        errors:
        - detail: Field 'name' is required.
          pointer: '#/name'
        instance: /v2/capability-sets
        status: 400
        title: Bad Request
        type: about:blank
      properties:
        code:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          description: An optional provider-specific code for internal error taxonomy and observability correlation.
          examples:
          - JENTIC-4001
          title: Code
        detail:
          description: A human-readable explanation specific to this occurrence of the problem. MUST be present. Provide actionable information where possible.
          examples:
          - The request body is missing required field 'name'.
          maxLength: 4096
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorItem'
            maxItems: 1000
            type: array
          - type: 'null'
          description: An array of granular error details. Use when multiple validation errors or field-level problems need to be surfaced in a single response.
          title: Errors
        instance:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A URI reference identifying the specific occurrence of the problem. Typically the request path.
          examples:
          - /v2/capability-sets
          title: Instance
        status:
          anyOf:
          - maximum: 599.0
            minimum: 100.0
            type: integer
          - type: 'null'
          description: The HTTP status code for this occurrence of the problem.
          examples:
          - 400
          title: Status
        title:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          description: A short, human-readable summary of the problem type. Should not change between occurrences except for localisation purposes.
          examples:
          - Bad Request
          title: Title
        type:
          default: about:blank
          description: A URI reference identifying the problem type. When set to 'about:blank', the title SHOULD be the standard HTTP status phrase. Use an IANA-registered type URI where one applies.
          examples:
          - about:blank
          maxLength: 1024
          title: Type
          type: string
      required:
      - detail
      title: ProblemDetail
      type: object
    BindingWarningSchema:
      description: A non-fatal signal about a bind (or create-time inline bind).
      properties:
        code:
          description: Stable machine-readable warning code.
          title: Code
          type: string
        credential_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Credential the warning applies to; null when the whole binding is meant.
          title: Credential Id
        message:
          description: Human-readable explanation with a recovery pointer.
          title: Message
          type: string
      required:
      - code
      - message
      title: BindingWarningSchema
      type: object
    ToolkitCredentialListResponse:
      description: Paginated list of credential bindings.
      properties:
        data:
          items:
            $ref: '#/components/schemas/ToolkitCredentialBindingResponse'
          title: Data
          type: array
        has_more:
          title: Has More
          type: boolean
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - data
      - has_more
      title: ToolkitCredentialListResponse
      type: object
  securitySchemes:
    BearerAuth:
      description: 'Opaque bearer access token (prefixed `at_`), sent as `Authorization: Bearer <token>`. It is **not** a JWT — it is a random string validated server-side by lookup, so it cannot be decoded by the client.


        Obtain one from `POST /oauth/token` using the grant for your actor type:

        - **Agents** — `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` with a JWT assertion signed by the key registered via `POST /register` (the JWT is the *assertion*, not the resulting access token).

        - **Service accounts** — `grant_type=client_credentials` with `client_id` + `client_secret`.

        - **Users** — `grant_type=authorization_code` (interactive) or `grant_type=password`; refresh either with `grant_type=refresh_token`.


        Service accounts can also mint short-lived, scope-narrowed task tokens for agents via `POST /oauth/mint`.


        Per-endpoint scope and actor-type requirements are not modelled in this document (OpenAPI cannot faithfully express the OR-of-scopes / `org:admin` bypass / service-layer enforcement); see `GET /reference/endpoints.json` for the authoritative authorization reference.'
      scheme: bearer
      type: http
